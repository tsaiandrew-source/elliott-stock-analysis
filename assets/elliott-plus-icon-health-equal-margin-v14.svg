      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#174B64" flood-opacity="0.2"/>
    </filter>
    <path id="plus" d="M725 214H854Q889 214 889 249V365H1005Q1040 365 1040 400V512Q1040 547 1005 547H889V663Q889 698 854 698H725Q690 698 690 663V547H574Q539 547 539 512V400Q539 365 574 365H690V249Q690 214 725 214Z"/>
