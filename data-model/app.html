<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="E+">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/elliott-asterisk-icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/elliott-asterisk-apple-touch-icon.png">
  <script src="../pwa-register.js" defer></script>
  <title>股票分析 · AppSheet prototype</title>
  <style>
    :root { color-scheme: dark; --bg:#071018; --surface:#0d1a25; --surface2:#112433; --line:#203849; --text:#edf6fb; --muted:#91a8b7; --aqua:#55d9d5; --lime:#c8f169; --purple:#9a66c7; --amber:#f2b84b; --green:#7ee787; --teal:#4fd1a5; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); }
    body { min-height:100vh; min-height:100dvh; margin:0; padding-top:env(safe-area-inset-top); padding-right:env(safe-area-inset-right); padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-text-size-adjust:100%; }
    button, select { font:inherit; }
    .app { min-height:100vh; display:grid; grid-template-columns:220px minmax(0,1fr); }
    .rail { padding:20px 14px; background:#09141e; border-right:1px solid var(--line); }
    .brand { padding:0 8px 18px; border-bottom:1px solid var(--line); }
    .eyebrow { color:var(--aqua); font-size:11px; font-weight:800; letter-spacing:.1em; }
    .brand h1 { margin:4px 0 0; font-size:20px; }
    .contract { margin-top:8px; color:var(--muted); font-size:11px; }
    .nav { display:grid; gap:6px; margin:18px 0; }
    .nav button, .ticker button { width:100%; border:0; border-radius:7px; padding:9px 10px; text-align:left; color:var(--muted); background:transparent; cursor:pointer; }
    .nav button[aria-pressed="true"], .ticker button[aria-pressed="true"] { color:#071018; background:var(--aqua); font-weight:800; }
    .coverage-form { display:grid; grid-template-columns:1fr 1fr 1fr 1fr auto; gap:8px; margin-top:12px; }
    .coverage-form input, .coverage-form select { min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:var(--surface2); }
    .action { border:1px solid var(--line); border-radius:6px; padding:6px 8px; color:var(--aqua); background:transparent; cursor:pointer; font-size:12px; font-weight:800; }
    .action[data-active="false"] { color:var(--amber); }
    .status-active { color:var(--green); font-weight:800; }
    .status-inactive { color:var(--amber); font-weight:800; }
    .ticker { display:grid; gap:4px; padding-top:13px; border-top:1px solid var(--line); }
    .coverage-rail-group { display:grid; gap:4px; }
    .coverage-rail-group + .coverage-rail-group { margin-top:12px; padding-top:10px; border-top:1px solid rgba(85,217,213,.18); }
    .coverage-rail-group > small { padding:0 10px 2px; color:var(--aqua); font-size:10px; font-weight:800; letter-spacing:.04em; }
    .coverage-rail-group + .coverage-rail-group > small { color:var(--amber); }
    .coverage-rail-group[data-market-group="twse"] > small { color:var(--teal); }
    .ticker button { display:grid; grid-template-columns:42px 1fr; gap:6px; align-items:center; }
    .ticker strong { color:inherit; }
    .ticker small { color:inherit; opacity:.76; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .main { min-width:0; padding:24px clamp(16px,4vw,46px) 36px; }
    .top { display:flex; align-items:start; justify-content:space-between; gap:18px; margin-bottom:20px; }
    .top h2 { margin:0; font-size:24px; }
    .top p { margin:4px 0 0; color:var(--muted); }
    .links { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .links a { color:var(--aqua); border:1px solid var(--line); border-radius:7px; padding:7px 9px; text-decoration:none; font-size:12px; font-weight:800; }
    .section { margin-top:16px; padding:16px; border:1px solid var(--line); border-radius:11px; background:var(--surface); }
    .section h3 { margin:0; color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .thesis { margin-top:10px; font-size:18px; line-height:1.45; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:14px; }
    .metric { min-width:0; padding:11px; border:1px solid var(--line); border-radius:8px; background:rgba(17,36,51,.48); }
    .metric .label { color:var(--muted); font-size:11px; }
    .metric p { margin:6px 0 0; color:var(--text); font-weight:700; }
    .metric[data-tone="pattern"] { border-top:2px solid var(--lime); }
    .metric[data-tone="wyckoff"] { border-top:2px solid var(--aqua); }
    .metric[data-tone="gex"] { border-top:2px solid var(--purple); }
    details { border-top:1px solid var(--line); margin-top:12px; padding-top:11px; }
    summary { color:var(--aqua); cursor:pointer; font-weight:800; }
    .digest { margin-top:10px; padding:11px; border-left:3px solid var(--aqua); background:rgba(17,36,51,.45); }
    .digest h4 { margin:0 0 6px; font-size:13px; }
    .digest ul { margin:0; padding-left:18px; }
    .digest li + li { margin-top:6px; }
    .table-wrap { overflow-x:auto; margin-top:10px; }
    table { width:100%; min-width:680px; border-collapse:collapse; font-size:12px; }
    th, td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-weight:700; }
    td strong { color:var(--aqua); }
    .empty { color:var(--muted); padding:20px 0; }
    .menu-backdrop { position:fixed; z-index:49; inset:0; border:0; background:rgba(3,9,14,.48); cursor:pointer; }
    .menu-backdrop[hidden], .ticker-sheet[hidden] { display:none; }
    .ticker-sheet { position:fixed; z-index:50; top:73px; right:50%; width:min(460px,calc(100vw - 28px)); height:44vh; max-height:44vh; overflow:hidden; transform:translateX(50%); padding:13px; border:1px solid rgba(85,217,213,.35); border-radius:16px; background:rgba(13,26,37,.98); box-shadow:0 18px 46px rgba(0,0,0,.42); }
    .ticker-sheet-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; }
    .ticker-sheet-head strong { color:var(--aqua); font-size:13px; }
    .ticker-sheet-head span { display:block; color:var(--muted); font-size:11px; font-weight:400; }
    .ticker-sheet-close { border:0; color:var(--muted); background:transparent; font-size:22px; line-height:1; cursor:pointer; }
    .ticker-wheel { display:flex; flex-direction:column; height:calc(44vh - 100px); overflow-y:auto; scroll-snap-type:y mandatory; border:1px solid var(--line); border-radius:11px; background:rgba(7,16,24,.52); }
    .ticker-wheel-item { display:flex; flex:0 0 42px; align-items:center; justify-content:space-between; gap:10px; scroll-snap-align:center; padding:6px 13px; border:0; border-bottom:1px solid rgba(32,56,73,.55); color:var(--muted); background:transparent; text-align:left; cursor:pointer; }
    .ticker-wheel-item:last-child { border-bottom:0; }
    .ticker-wheel-item strong { font-size:13px; }
    .ticker-wheel-item span { overflow:hidden; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .ticker-wheel-item.is-current { color:var(--text); background:rgba(85,217,213,.13); box-shadow:inset 3px 0 var(--aqua); }
    .ticker-wheel-item.is-current strong { color:var(--aqua); }
    @media (min-width:1000px) {
      body { padding-top:0; padding-bottom:0; }
      .ticker-sheet { top:73px; bottom:auto; }
    }
    @media (max-width:760px) {
      .app { display:block; }
      .rail { border-right:0; border-bottom:1px solid var(--line); padding:12px; }
      .brand { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:10px; }
      .contract { margin:0; text-align:right; }
      .nav { grid-template-columns:repeat(4,1fr); margin:10px 0; }
      .nav button { text-align:center; padding:8px 5px; }
      .ticker { grid-template-columns:repeat(2,1fr); border-top:0; padding-top:0; }
      .ticker button { grid-template-columns:38px 1fr; }
      .main { padding:18px 12px 28px; }
      .top { display:block; }
      .links { justify-content:flex-start; margin-top:12px; }
      .grid { grid-template-columns:1fr; }
      .thesis { font-size:17px; }
      .ticker-sheet { width:calc(100vw - 24px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand"><div><div class="eyebrow">Elliott+ prototype</div><h1>股票分析</h1></div><div class="contract" id="contract"></div></div>
      <nav class="nav" aria-label="Primary views">
        <button type="button" data-view="latest" aria-pressed="true">Latest</button>
        <button type="button" data-view="history" aria-pressed="false">History</button>
        <button type="button" data-view="sources" aria-pressed="false">Sources</button>
      </nav>
      <div class="ticker" id="ticker-list" aria-label="Coverage"></div>
    </aside>
    <main class="main">
      <header class="top"><div><h2 id="heading"></h2><p id="subheading"></p></div><div class="links" id="chart-links"></div></header>
      <div id="content"></div>
    </main>
  </div>
  <button type="button" class="menu-backdrop" id="menu-backdrop" aria-label="關閉代號選單" hidden></button>
  <section class="ticker-sheet" id="ticker-sheet" aria-label="Ticker selections" hidden>
    <div class="ticker-sheet-head"><div><strong>選擇代號</strong><span>上下捲動或點選以開啟分析</span></div><button type="button" class="ticker-sheet-close" id="ticker-sheet-close" aria-label="關閉代號選單">×</button></div>
    <div class="ticker-wheel" id="ticker-wheel" role="listbox" aria-label="選擇目前代號"></div>
  </section>
  <script src="../shared-menu.js?v=20260910-1"></script>
  <elliott-shared-menu data-current="ticker" data-home-href="home.html" data-coverage-href="coverage.html"></elliott-shared-menu>
  <script src="../chart-surface/analysis-packets-v2.js?v=20260909-v4"></script>
  <script src="../chart-surface/eod-digest-20260908.js?v=20260909-v1"></script>
  <script>document.write('<script src="../chart-surface/data-contract.js?open=' + Date.now() + '"><\/script>');</script>
  <script src="../coverage-order.js?v=20260909-v1"></script>
  <script>
    (() => {
      const contract = window.PROTOTYPE_DATA_CONTRACT || {};
      const datasets = contract.datasets?.benchmark || {};
      const irisV2 = window.PROTOTYPE_IRIS_V2 || {};
      const v2Batches = Object.values(irisV2.batches || {});
      const v2Runs = v2Batches.flatMap((batch) => [
        ...(batch.dailyPackets || []).map((packet) => ({ ...packet, schemaVersion: batch.schemaVersion, batchId: batch.batchId, runType: 'daily', pattern: packet.patternLabel, confidence: packet.confidencePercent, wyckoff: packet.wyckoffPhase?.daily, options: packet.gexSummary?.displayText, business: packet.fundamentalsNews })),
        ...(batch.weeklyPackets || []).map((packet) => ({ ...packet, schemaVersion: batch.schemaVersion, batchId: batch.batchId, runType: 'weekly', pattern: packet.patternLabel, confidence: packet.confidencePercent, wyckoff: packet.wyckoffPhase?.weekly, options: packet.gexSummary?.displayText, business: packet.fundamentalsNews }))
      ]);
      const trackingTickers = new Set(['2646', 'LITE', 'NBIS', 'PLTR', 'IREN', 'NOK', 'ACHR', 'CSCO', 'AMKR', 'ONDS']);
      const explorationTickers = new Set(['NVDA', 'MRVL', 'SNDK', '2330', 'AVGO']);
      const twseTickers = new Set(['2330', '2646']);
      const canonicalCoverageGroup = (ticker) => {
        const symbol = String(ticker || '').trim().toUpperCase();
        if (trackingTickers.has(symbol)) return 'tracking';
        if (explorationTickers.has(symbol)) return 'exploration';
        return null;
      };
      const inferredCoverageGroup = (ticker) => canonicalCoverageGroup(ticker) || 'tracking';
      const inferredMarketGroup = (ticker) => twseTickers.has(String(ticker || '').trim().toUpperCase()) ? 'twse' : 'us';
      const baseCoverage = [
        ...(contract.coverage || []).map((item) => ({ ...item, coverageGroup: canonicalCoverageGroup(item.ticker) || item.coverageGroup || item.CoverageGroup || inferredCoverageGroup(item.ticker), marketGroup: item.marketGroup || item.MarketGroup || inferredMarketGroup(item.ticker) })),
        ...[...new Set(v2Runs.map((run) => run.ticker))].map((ticker) => ({ ticker, company: v2Runs.find((run) => run.ticker === ticker)?.company || ticker, active: true, coverageGroup: inferredCoverageGroup(ticker), marketGroup: inferredMarketGroup(ticker) }))
      ].filter((item, index, rows) => rows.findIndex((candidate) => candidate.ticker === item.ticker) === index);
      let coverageOverrides = {};
      try { coverageOverrides = JSON.parse(localStorage.getItem('stock-analysis-coverage-overrides') || '{}'); } catch { coverageOverrides = {}; }
      const coverageRows = () => {
        const rows = new Map(baseCoverage.map((item) => [item.ticker, { ...item }]));
        Object.entries(coverageOverrides).forEach(([ticker, item]) => rows.set(ticker, { ...(rows.get(ticker) || { ticker }), ...item }));
        return [...rows.values()];
      };
      const activeCoverage = () => window.PROTOTYPE_SORT_COVERAGE(coverageRows()
        .filter((item) => item.removed !== true && item.active !== false && (datasets[item.ticker] || v2Runs.some((run) => run.ticker === item.ticker))));
      const runMap = new Map();
      [...(contract.analysisRuns || []), ...v2Runs].forEach((run) => { const key = run.runId || [run.ticker, run.analysisDate, run.runType].join('|'); if (key) runMap.set(key, run); });
      const runs = [...runMap.values()];
      const query = new URLSearchParams(window.location.search);
      const initialView = ['history', 'sources'].includes(query.get('view')) ? query.get('view') : 'latest';
      const state = { view: initialView, ticker: query.get('ticker') || activeCoverage()[0]?.ticker || '' };
      const $ = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
      const normalizeCoverageGroup = (value, ticker = '') => {
        const normalized = String(value ?? '').trim().toLowerCase();
        if (['exploration', 'explore', 'exploratory'].includes(normalized)) return 'exploration';
        if (['tracking', 'tracked', 'track'].includes(normalized)) return 'tracking';
        return explorationTickers.has(String(ticker || '').trim().toUpperCase()) ? 'exploration' : 'tracking';
      };
      const coverageGroupLabel = (group) => normalizeCoverageGroup(group) === 'exploration' ? 'Exploration · 探索' : 'Tracked · 追蹤';
      const coverageGroup = (item) => normalizeCoverageGroup(item.coverageGroup || item.CoverageGroup || item.group, item.ticker);
      const normalizeMarketGroup = (value, ticker = '') => {
        const normalized = String(value ?? '').trim().toLowerCase();
        if (['twse', 'taiwan', 'taiwan stock exchange', 'taiwan-stock-exchange'].includes(normalized)) return 'twse';
        return twseTickers.has(String(ticker || '').trim().toUpperCase()) ? 'twse' : 'us';
      };
      const marketGroup = (item) => normalizeMarketGroup(item.marketGroup || item.MarketGroup || item.exchange, item.ticker);
      const marketGroupLabel = (group) => normalizeMarketGroup(group) === 'twse' ? 'Taiwan Stock Exchange · 台灣證券交易所' : 'US Markets · 美國市場';
      const isRichAnalysisRun = (run) => run?.schemaVersion === 'iris-analysis-contract-v2' || Boolean(run?.patternLabel || run?.businessEvidence || run?.dailyDigest || run?.gexSummary);
      const latestRun = () => {
        const candidates = runs.filter((run) => run.ticker === state.ticker);
        const rich = candidates.filter(isRichAnalysisRun);
        return (rich.length ? rich : candidates).sort((a, b) => String(b.analysisDate || '').localeCompare(String(a.analysisDate || '')))[0];
      };
      const detail = () => contract.datasets?.analysisDetails?.[state.ticker] || {};
      function closeTickerSheet() {
        $('ticker-sheet').hidden = true;
        $('menu-backdrop').hidden = true;
        $('ticker-menu-toggle').setAttribute('aria-expanded', 'false');
      }
      function renderDock() {
        const coverage = activeCoverage();
        $('dock-home').href = 'home.html';
        $('dock-coverage').href = `coverage.html?ticker=${encodeURIComponent(state.ticker)}`;
        const wheel = $('ticker-wheel');
        wheel.replaceChildren(...coverage.map((item) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'ticker-wheel-item' + (item.ticker === state.ticker ? ' is-current' : '');
          button.dataset.ticker = item.ticker;
          button.setAttribute('role', 'option');
          button.setAttribute('aria-selected', String(item.ticker === state.ticker));
          const ticker = document.createElement('strong');
          ticker.textContent = item.ticker;
          const company = document.createElement('span');
          company.textContent = item.company || item.ticker;
          button.append(ticker, company);
          button.addEventListener('click', () => {
            window.location.href = `../chart-surface/index.html?ticker=${encodeURIComponent(item.ticker)}&view=daily`;
          });
          return button;
        }));
        const currentItem = wheel.querySelector('.is-current');
        if (currentItem) wheel.scrollTop = Math.max(0, currentItem.offsetTop - wheel.clientHeight / 2 + currentItem.offsetHeight / 2);
      }
      function renderRail() {
        $('contract').textContent = contract.mode === 'sheets-csv-import' ? 'Sheets import' : 'Local seed';
        document.querySelectorAll('[data-view]').forEach((button) => { const active = button.dataset.view === state.view; button.setAttribute('aria-pressed', String(active)); });
        const railItems = ['tracking', 'exploration', 'twse'].map((group) => {
          const items = activeCoverage().filter((item) => group === 'twse' ? marketGroup(item) === 'twse' : marketGroup(item) !== 'twse' && coverageGroup(item) === group);
          const label = group === 'twse' ? marketGroupLabel(group) : coverageGroupLabel(group);
          return `<div class="coverage-rail-group" data-market-group="${group}"><small>${label}</small>${items.map((item) => `<button type="button" data-ticker="${escapeHtml(item.ticker)}" aria-pressed="${item.ticker === state.ticker}"><strong>${escapeHtml(item.ticker)}</strong><small>${escapeHtml(item.company)}</small></button>`).join('')}</div>`;
        }).join('');
        $('ticker-list').innerHTML = railItems;
        $('ticker-list').querySelectorAll('[data-ticker]').forEach((button) => button.addEventListener('click', () => { state.ticker = button.dataset.ticker; render(); }));
      }
      function renderLinks() {
        const base = `../chart-surface/index.html?ticker=${encodeURIComponent(state.ticker)}`;
        $('chart-links').innerHTML = `<a href="${base}&view=gex">GEX</a><a href="${base}&view=daily">日線</a><a href="${base}&view=weekly">週線</a>`;
      }
      function renderLatest() {
        const data = datasets[state.ticker] || {}; const run = latestRun();
        const isV2 = run?.schemaVersion === 'iris-analysis-contract-v2';
        $('heading').textContent = `${state.ticker} · ${run?.company || data.company || state.ticker}`;
        $('subheading').textContent = `Latest · 資料截至 ${run?.dataThrough || data.dataThrough || '未標示'}`;
        const digest = isV2 ? (run.runType === 'weekly' ? run.weeklyDigest : run.dailyDigest?.endOfDay) : (detail().endOfDay || detail().weekly);
        const digestSummary = run.runType === 'weekly' ? `${digest?.date || ''} · ${digest?.title || ''}` : `EoD Digest · ${String(digest?.date || '').slice(0, 10)}`;
        const digestPoints = digest?.sections ? digest.sections.flatMap((section) => section.points || []) : (digest?.points || []);
        const digestHtml = digest ? `<details><summary>${escapeHtml(digestSummary)}</summary><div class="digest"><h4>${escapeHtml(digest.title || '摘要')}</h4><ul>${digestPoints.slice(0, 12).map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ul></div></details>` : '';
        const pattern = isV2 ? run.patternLabel : (run?.pattern || data.pattern);
        const wyckoff = isV2 ? (run.wyckoffPhase?.daily || '日線 Wyckoff 待補。') : (run?.wyckoff || data.wyckoff);
        const gex = isV2 ? (run.gexSummary?.displayText || (run.gexSummary?.status === 'not_applicable' ? 'GEX 資料不適用。' : 'GEX 狀態待補。')) : (run?.options || data.options);
        const thesis = isV2 ? run.thesis : (run?.thesis || data.thesis);
        const business = isV2 ? run.fundamentalsNews : (run?.business || data.business);
        $('content').innerHTML = `<section class="section"><h3>核心論述</h3><div class="thesis">${escapeHtml(thesis)}</div><div class="grid"><div class="metric" data-tone="pattern"><div class="label">型態組合</div><p>${escapeHtml(pattern)}</p></div><div class="metric" data-tone="wyckoff"><div class="label">Wyckoff 階段</div><p>${escapeHtml(wyckoff)}</p></div><div class="metric" data-tone="gex"><div class="label">選擇權／GEX</div><p>${escapeHtml(gex)}</p></div></div>${digestHtml}</section><section class="section"><h3>基本面／新聞</h3><p>${escapeHtml(business)}</p><p class="empty">完整內容依可用的日報／週報展開。</p></section>`;
      }
      function renderHistory() {
        const data = datasets[state.ticker]; const rows = runs.filter((run) => run.ticker === state.ticker).sort((a, b) => b.analysisDate.localeCompare(a.analysisDate));
        $('heading').textContent = `${state.ticker} · 分析歷史`;
        $('subheading').textContent = `${rows.length} 筆 append-only records · 不覆寫過往論述`;
        $('content').innerHTML = `<section class="section"><h3>Historical analyses</h3><div class="table-wrap"><table><thead><tr><th>日期</th><th>類型</th><th>型態</th><th>信心</th><th>Wyckoff</th><th>論述</th></tr></thead><tbody>${rows.map((row) => `<tr><td><strong>${escapeHtml(row.analysisDate)}</strong></td><td>${escapeHtml(row.runType)}</td><td>${escapeHtml(row.pattern)}</td><td>${escapeHtml(row.confidence)}</td><td>${escapeHtml(row.wyckoff)}</td><td>${escapeHtml(row.thesis)}</td></tr>`).join('')}</tbody></table></div></section>`;
      }
      function renderSources() {
        const sources = contract.tables?.Sources || [];
        $('heading').textContent = '來源追溯';
        $('subheading').textContent = `${state.ticker} · source registry`;
        $('content').innerHTML = `<section class="section"><h3>Sources</h3><div class="table-wrap"><table><thead><tr><th>來源族群</th><th>提供者</th><th>截止</th><th>狀態</th><th>連結</th></tr></thead><tbody>${sources.filter((row) => !field(row, 'Ticker') || field(row, 'Ticker') === state.ticker).map((row) => `<tr><td>${escapeHtml(field(row, 'SourceFamily'))}</td><td>${escapeHtml(field(row, 'Provider'))}</td><td>${escapeHtml(field(row, 'Cutoff'))}</td><td>${escapeHtml(field(row, 'EvidenceStatus'))}</td><td>${field(row, 'URL') ? `<a href="${escapeHtml(field(row, 'URL'))}" target="_blank" rel="noopener">open</a>` : escapeHtml(field(row, 'LocalArtifact'))}</td></tr>`).join('')}</tbody></table></div></section>`;
      }
      function saveCoverage() { localStorage.setItem('stock-analysis-coverage-overrides', JSON.stringify(coverageOverrides)); }
      function renderCoverage() {
        $('heading').textContent = 'Coverage';
        $('subheading').textContent = '新增、停用或移除 ticker；停用只離開選擇清單，移除保留歷史分析。';
        $('content').innerHTML = `<section class="section"><h3>Coverage table</h3><form class="coverage-form" id="coverage-form"><input id="new-ticker" placeholder="Ticker，例如：AMD" maxlength="12" required><input id="new-company" placeholder="Company name" maxlength="48"><select id="new-group" aria-label="Coverage group"><option value="tracking">Tracked · 追蹤</option><option value="exploration">Exploration · 探索</option></select><select id="new-market" aria-label="Market group"><option value="us">US Markets · 美國市場</option><option value="twse">Taiwan Stock Exchange · 台股</option></select><button class="action" type="submit">Add</button></form><div class="table-wrap"><table><thead><tr><th>Ticker</th><th>Company</th><th>Group</th><th>Default view</th><th>Status</th><th>Action</th></tr></thead><tbody>${['tracking', 'exploration', 'twse'].map((group) => { const groupRows = coverageRows().filter((row) => row.removed !== true && (group === 'twse' ? marketGroup(row) === 'twse' : marketGroup(row) !== 'twse' && coverageGroup(row) === group)); const label = group === 'twse' ? marketGroupLabel(group) : coverageGroupLabel(group); return `<tr><td colspan="6"><strong>${label}</strong></td></tr>${groupRows.map((row) => `<tr><td><strong>${escapeHtml(row.ticker)}</strong></td><td>${escapeHtml(row.company || row.ticker)}</td><td>${escapeHtml(coverageGroupLabel(coverageGroup(row)))}</td><td>${escapeHtml(row.defaultView || 'daily')}</td><td class="${row.active === false ? 'status-inactive' : 'status-active'}">${row.active === false ? 'Inactive' : 'Active'}</td><td><button type="button" class="action" data-active="${row.active !== false}" data-toggle-ticker="${escapeHtml(row.ticker)}">${row.active === false ? 'Reactivate' : 'Deactivate'}</button><button type="button" class="action" data-remove-ticker="${escapeHtml(row.ticker)}">Remove</button></td></tr>`).join('')}`; }).join('')}</tbody></table></div></section>`;
        $('coverage-form').addEventListener('submit', (event) => {
          event.preventDefault();
          const ticker = $('new-ticker').value.trim().toUpperCase();
          if (!ticker) return;
          coverageOverrides[ticker] = { ...(coverageRows().find((row) => row.ticker === ticker) || {}), ticker, company: $('new-company').value.trim() || ticker, coverageGroup: $('new-group').value, marketGroup: $('new-market').value, active: true, defaultView: 'daily' };
          saveCoverage(); state.ticker = ticker; render();
        });
        document.querySelectorAll('[data-toggle-ticker]').forEach((button) => button.addEventListener('click', () => {
          const ticker = button.dataset.toggleTicker;
          coverageOverrides[ticker] = { ...(coverageRows().find((row) => row.ticker === ticker) || {}), ticker, active: button.dataset.active !== 'true' };
          saveCoverage(); render();
        }));
        document.querySelectorAll('[data-remove-ticker]').forEach((button) => button.addEventListener('click', () => {
          const ticker = button.dataset.removeTicker;
          if (!window.confirm(`Remove ${ticker} from Coverage? Historical analyses will be preserved, but the ticker will disappear from Management and selection.`)) return;
          coverageOverrides[ticker] = { ...(coverageRows().find((row) => row.ticker === ticker) || { ticker }), ticker, hidden: true, removed: true, active: false };
          saveCoverage(); render();
        }));
      }
      function field(row, name) { const key = Object.keys(row || {}).find((candidate) => candidate.toLowerCase() === name.toLowerCase()); return key ? row[key] : ''; }
      function render() { renderDock(); renderRail(); renderLinks(); if (state.view === 'history') renderHistory(); else if (state.view === 'sources') renderSources(); else if (datasets[state.ticker] || runs.some((run) => run.ticker === state.ticker)) renderLatest(); else { $('heading').textContent = `${state.ticker} · 尚未有資料`; $('subheading').textContent = 'Coverage 已加入；等待下一次 Sheets／市場資料 refresh。'; $('content').innerHTML = '<section class="section"><p class="empty">此 ticker 已加入 Coverage，但目前尚未有圖表或分析資料。歷史資料不會因停用而刪除。</p></section>'; } }
      document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => {
        if (button.dataset.view === 'latest') {
          window.location.href = `../chart-surface/index.html?ticker=${encodeURIComponent(state.ticker)}&view=daily`;
          return;
        }
        state.view = button.dataset.view;
        render();
      }));
      $('ticker-menu-toggle').addEventListener('click', () => {
        const sheet = $('ticker-sheet');
        if (sheet.hidden) {
          renderDock();
          sheet.hidden = false;
          $('menu-backdrop').hidden = false;
          $('ticker-menu-toggle').setAttribute('aria-expanded', 'true');
        } else closeTickerSheet();
      });
      $('ticker-sheet-close').addEventListener('click', closeTickerSheet);
      $('menu-backdrop').addEventListener('click', closeTickerSheet);
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !$('ticker-sheet').hidden) closeTickerSheet(); });
      render();
    })();
  </script>
</body>
</html>
