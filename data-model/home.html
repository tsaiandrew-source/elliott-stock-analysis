<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../assets/elliott-plus-icon.svg">
  <link rel="mask-icon" href="../assets/elliott-plus-icon.svg" color="#55d9d5">
  <title>股票分析首頁</title>
  <style>
    :root { color-scheme: dark; --bg:#071018; --surface:#0d1a25; --surface2:#112433; --line:#203849; --text:#edf6fb; --muted:#91a8b7; --aqua:#55d9d5; --green:#7ee787; --lime:#c8f169; --amber:#f2b84b; --rose:#ff7e8f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button, a { font:inherit; }
    .home { width:min(760px,100%); margin:0 auto; padding:24px 20px 38px; }
    .top { display:flex; align-items:start; justify-content:space-between; gap:16px; margin-bottom:22px; }
    .eyebrow { color:var(--aqua); font-size:11px; font-weight:800; letter-spacing:.1em; }
    h1 { margin:4px 0 0; color:var(--aqua); font-size:24px; }
    .subtitle { margin-top:5px; color:var(--muted); font-size:13px; }
    .section { padding:15px; border:1px solid var(--line); border-radius:13px; background:var(--surface); }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-bottom:10px; border-bottom:1px solid var(--line); }
    .section-head strong { color:var(--aqua); font-size:13px; }
    .section-head span { color:var(--muted); font-size:11px; }
    .section-head-tools { display:flex; align-items:center; justify-content:flex-end; gap:9px; }
    .coverage-tabs { display:flex; gap:5px; }
    .coverage-tab { display:inline-flex; align-items:center; justify-content:center; width:36px; height:32px; border:1px solid var(--line); border-radius:8px; padding:5px; color:var(--muted); background:transparent; cursor:pointer; }
    .coverage-tab svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .coverage-tab[aria-selected="true"] { border-color:var(--aqua); color:#071018; background:var(--aqua); }
    .coverage-tab:hover, .coverage-tab:focus-visible { border-color:var(--aqua); color:var(--text); }
    .coverage-tab[aria-selected="true"]:hover, .coverage-tab[aria-selected="true"]:focus-visible { color:#071018; }
    .coverage-panel[hidden] { display:none; }
    .ticker-list { display:grid; gap:8px; margin-top:11px; overflow-x:auto; }
    .coverage-group + .coverage-group { margin-top:18px; }
    .coverage-group-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 2px 7px; padding-bottom:5px; border-bottom:1px solid rgba(85,217,213,.22); }
    .coverage-group-head strong { color:var(--aqua); font-size:12px; }
    .coverage-group-head span { color:var(--muted); font-size:10px; }
    .coverage-group[data-group="exploration"] .coverage-group-head { border-bottom-color:rgba(242,184,75,.32); }
    .coverage-group[data-group="exploration"] .coverage-group-head strong { color:var(--amber); }
    .coverage-group-empty { margin:0; padding:8px 3px 2px; color:var(--muted); font-size:11px; }
    .coverage-header, .ticker-row { min-width:0; }
    .coverage-header { display:grid; grid-template-columns:9px 74px minmax(180px,1fr) 42px 72px 62px 26px; gap:8px; padding:0 11px 6px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .ticker-row { display:grid; grid-template-columns:9px 74px minmax(180px,1fr) 42px 72px 62px 26px; align-items:center; gap:8px; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:rgba(17,36,51,.42); }
    .ticker-row.has-detail { cursor:pointer; }
    .ticker-row.has-detail:hover { border-color:rgba(85,217,213,.6); background:rgba(17,36,51,.7); }
    .ticker-row.has-detail:focus-visible { outline:2px solid var(--aqua); outline-offset:2px; }
    .ticker-row.is-disabled { color:var(--muted); cursor:not-allowed; }
    .ticker-copy strong { display:block; font-size:14px; }
    .ticker-copy, .latest-pattern, .latest-direction, .latest-confidence, .latest-date { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .latest-pattern { color:var(--text); font-size:12px; }
    .latest-direction { color:var(--aqua); font-size:18px; font-weight:800; line-height:1; text-align:center; }
    .latest-direction[data-direction="up"] { color:var(--green); }
    .latest-direction[data-direction="down"] { color:var(--rose); }
    .latest-direction[data-direction="flat"] { color:var(--amber); }
    .latest-confidence { color:var(--lime); font-size:13px; font-weight:800; }
    .latest-date { color:var(--muted); font-size:11px; }
    .ticker-copy em { color:var(--muted); font-size:11px; font-style:normal; white-space:nowrap; }
    .new-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(126,231,135,.13); }
    .new-dot[hidden] { display:none; }
    .ticker-history-toggle { grid-column:7; grid-row:1; align-self:center; justify-self:center; width:auto; height:auto; padding:0; border:0; color:var(--aqua); background:transparent; font-size:18px; font-weight:500; line-height:1; text-align:center; cursor:pointer; }
    .ticker-history-toggle:hover, .ticker-history-toggle:focus-visible { color:var(--text); }
    .history-panel { grid-column:1 / -1; grid-row:2; width:100%; min-width:640px; margin:9px 0 0 18px; padding-top:6px; border-top:1px solid rgba(32,56,73,.7); }
    .history-panel[hidden] { display:none; }
    .history-entry { padding-top:6px; color:var(--muted); font-size:11px; white-space:normal; overflow-wrap:break-word; }
    .history-entry strong { color:var(--text); }
    .coverage-form { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto; gap:8px; margin-top:12px; }
    .coverage-form input, .coverage-form select { min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:var(--surface2); }
    .coverage-form input::placeholder { color:var(--muted); }
    .action { border:1px solid var(--line); border-radius:6px; padding:6px 9px; color:var(--aqua); background:transparent; cursor:pointer; font-size:12px; font-weight:800; }
    .action:hover, .action:focus-visible { border-color:var(--aqua); background:rgba(85,217,213,.08); }
    .action[data-active="false"] { color:var(--amber); }
    .status-active { color:var(--green); font-weight:800; }
    .status-inactive { color:var(--amber); font-weight:800; }
    .status-removed { color:var(--muted); font-weight:800; }
    .coverage-admin { margin-top:10px; }
    .coverage-admin table { width:100%; min-width:620px; border-collapse:collapse; font-size:12px; }
    .coverage-admin th, .coverage-admin td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    .coverage-admin th { color:var(--muted); font-size:11px; }
    .coverage-admin td:first-child { color:var(--aqua); }
    .coverage-admin .group-row td { padding-top:14px; padding-bottom:6px; border-bottom-color:rgba(85,217,213,.24); color:var(--aqua); font-size:11px; font-weight:800; letter-spacing:.04em; }
    .coverage-admin .group-row.exploration td { color:var(--amber); border-bottom-color:rgba(242,184,75,.32); }
    .coverage-admin-wrap { overflow-x:auto; }
    .empty { padding:20px 0; color:var(--muted); }
    .foot { margin-top:13px; color:var(--muted); font-size:11px; }
    .menu-backdrop { position:fixed; z-index:49; inset:0; border:0; background:rgba(3,9,14,.48); cursor:pointer; }
    .menu-backdrop[hidden], .ticker-sheet[hidden] { display:none; }
    .floating-dock { position:fixed; z-index:60; top:14px; right:50%; display:flex; align-items:center; gap:7px; transform:translateX(50%); padding:7px; border:1px solid rgba(85,217,213,.38); border-radius:17px; background:rgba(85,217,213,.06); box-shadow:0 14px 38px rgba(0,0,0,.34),0 0 0 1px rgba(85,217,213,.06) inset; backdrop-filter:blur(3px); }
    .dock-action { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-width:102px; height:42px; padding:7px 12px; border:0; border-radius:11px; color:var(--muted); background:transparent; text-decoration:none; font-size:12px; font-weight:800; cursor:pointer; }
    .dock-action:hover, .dock-action:focus-visible { color:var(--text); background:var(--surface2); }
    .dock-icon { color:var(--aqua); font-size:20px; line-height:1; }
    .ticker-sheet { position:fixed; z-index:50; top:73px; right:50%; width:min(460px,calc(100vw - 28px)); height:44vh; max-height:44vh; overflow:hidden; transform:translateX(50%); padding:13px; border:1px solid rgba(85,217,213,.35); border-radius:16px; background:rgba(13,26,37,.98); box-shadow:0 18px 46px rgba(0,0,0,.42); }
    .ticker-sheet-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; }
    .ticker-sheet-head strong { color:var(--aqua); font-size:13px; }
    .ticker-sheet-head span { display:block; color:var(--muted); font-size:11px; font-weight:400; }
    .ticker-sheet-close { border:0; color:var(--muted); background:transparent; font-size:22px; line-height:1; cursor:pointer; }
    .ticker-wheel { display:flex; flex-direction:column; height:calc(44vh - 100px); overflow-y:auto; scroll-snap-type:y mandatory; border:1px solid var(--line); border-radius:11px; background:rgba(7,16,24,.52); }
    .ticker-wheel-item { display:flex; flex:0 0 42px; align-items:center; justify-content:space-between; gap:10px; scroll-snap-align:center; padding:6px 13px; border:0; border-bottom:1px solid rgba(32,56,73,.55); color:var(--muted); background:transparent; text-align:left; cursor:pointer; }
    .ticker-wheel-item:last-child { border-bottom:0; }
    .ticker-wheel-item strong { font-size:13px; }
    .ticker-wheel-item span { overflow:hidden; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .ticker-wheel-item.is-current { color:var(--text); background:rgba(85,217,213,.13); box-shadow:inset 3px 0 var(--aqua); }
    .ticker-wheel-item.is-current strong { color:var(--aqua); }
    .ticker-wheel-item:disabled { opacity:.62; cursor:not-allowed; }
    .ticker-wheel-item:disabled strong { color:var(--muted); }
    @media (min-width:1000px) {
      body { padding-top:0; padding-bottom:0; }
      .floating-dock { top:14px; bottom:auto; }
      .ticker-sheet { top:73px; bottom:auto; }
    }
    @media (max-width:560px) {
      body { padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
      .home { padding:16px 12px 30px; }
      .top { display:block; }
      .section { padding:12px; }
      .coverage-form { grid-template-columns:1fr; }
      .coverage-header, .ticker-row { min-width:0; }
      .floating-dock { right:12px; left:12px; justify-content:center; transform:none; }
      .dock-action { flex:1 1 0; min-width:0; }
      .ticker-sheet { width:calc(100vw - 24px); }
    }
    @media (min-width:561px) and (max-width:999px) and (min-height:600px) {
      .floating-dock { right:50%; left:auto; width:max-content; max-width:calc(100vw - 32px); transform:translateX(50%); }
      .dock-action { flex:0 0 auto; min-width:96px; }
      .ticker-sheet { top:73px; }
      body { font-size:16px; }
      .home { padding:24px; }
      h1 { font-size:28px; }
      .subtitle { font-size:15px; }
      .section { padding:18px; }
      .section-head strong { font-size:15px; }
      .section-head span, .coverage-tab { font-size:13px; }
      .coverage-tab { padding:8px 12px; }
      .coverage-header { font-size:12px; }
      .ticker-copy strong { font-size:16px; }
      .latest-pattern { font-size:14px; }
      .latest-confidence { font-size:15px; }
      .latest-date, .history-entry, .foot { font-size:13px; }
      .action { font-size:14px; }
      .coverage-admin table { font-size:14px; }
      .coverage-admin th { font-size:13px; }
      .dock-action { height:46px; font-size:14px; }
      .dock-icon { font-size:22px; }
      .ticker-sheet-head strong { font-size:15px; }
      .ticker-sheet-head span, .ticker-wheel-item span { font-size:13px; }
      .ticker-wheel-item strong { font-size:15px; }
    }
    @media (max-width:560px) {
      .floating-dock { top:auto; bottom:calc(12px + env(safe-area-inset-bottom)); left:12px; right:12px; width:auto; transform:none; padding:5px; border-radius:15px; background:rgba(30,89,99,.18); backdrop-filter:blur(1px); }
      .dock-action { height:44px; padding:7px 10px; font-size:12px; }
      .dock-icon { font-size:20px; }
      .ticker-sheet { top:auto; bottom:calc(69px + env(safe-area-inset-bottom)); height:min(44vh,320px); max-height:min(44vh,320px); }
      .ticker-wheel { height:calc(min(44vh,320px) - 100px); }
    }
    /* Portrait phones keep the analysis scan line compact: ticker, pattern,
       confidence, updated date, and the inline history affordance. */
    @media (max-width:560px) and (orientation: portrait) {
      .ticker-list { overflow-x:visible; }
      .coverage-header, .ticker-row { min-width:0; }
      .coverage-header { grid-template-columns:9px 58px minmax(0,1fr) 28px 58px 62px 22px; gap:6px; padding-left:8px; padding-right:8px; }
      .ticker-row { grid-template-columns:9px 58px minmax(0,1fr) 28px 58px 62px 22px; gap:6px; padding:9px 8px; }
      .ticker-history { grid-column:7; }
      .ticker-history-toggle { grid-column:7; grid-row:1; font-size:18px; }
      .history-panel { grid-column:1 / -1; grid-row:2; min-width:0; margin-left:0; padding-right:2px; }
      .history-entry { line-height:1.45; overflow-wrap:break-word; word-break:normal; }
    }
    /* Small landscape phones still use a compact scan row; do not let the
       tablet sizing rules make the history panel oversized. */
    @media (max-width:700px) and (orientation: landscape) {
      body { padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
      .home { padding:16px 12px 30px; }
      .section { padding:12px; }
      .ticker-list { overflow-x:visible; }
      .coverage-header, .ticker-row { min-width:0; }
      .coverage-header { grid-template-columns:9px 58px minmax(0,1fr) 28px 58px 62px 22px; gap:6px; padding-left:8px; padding-right:8px; }
      .ticker-row { grid-template-columns:9px 58px minmax(0,1fr) 28px 58px 62px 22px; gap:6px; padding:9px 8px; }
      .ticker-history-toggle { grid-column:7; grid-row:1; font-size:18px; }
      .history-panel { grid-column:1 / -1; grid-row:2; min-width:0; margin-left:0; padding-right:2px; }
      .history-entry { line-height:1.45; overflow-wrap:break-word; word-break:normal; }
      .floating-dock { top:auto; bottom:calc(12px + env(safe-area-inset-bottom)); left:12px; right:12px; width:auto; transform:none; padding:5px; border-radius:15px; background:rgba(30,89,99,.18); backdrop-filter:blur(1px); }
      .dock-action { height:44px; padding:7px 10px; font-size:12px; }
      .dock-icon { font-size:20px; }
      .ticker-sheet { top:auto; bottom:calc(69px + env(safe-area-inset-bottom)); height:min(44vh,320px); max-height:min(44vh,320px); }
      .ticker-wheel { height:calc(min(44vh,320px) - 100px); }
    }
    /* iPhone landscape is wider than 700px. Use the viewport height to keep
       it in the compact phone treatment instead of the larger tablet rules. */
    @media (max-width:999px) and (orientation: landscape) and (max-height:500px) {
      body { font-size:15px; padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
      .home { width:min(760px,100%); padding:16px 12px 30px; }
      .section { padding:12px; }
      .coverage-header, .ticker-row { min-width:0; }
      .coverage-header { grid-template-columns:9px 58px minmax(0,1fr) 28px 58px 62px 22px; gap:6px; padding-left:8px; padding-right:8px; font-size:10px; }
      .ticker-row { grid-template-columns:9px 58px minmax(0,1fr) 28px 58px 62px 22px; gap:6px; padding:9px 8px; }
      .latest-pattern { font-size:12px; }
      .latest-confidence { font-size:13px; }
      .latest-date { font-size:11px; }
      .ticker-history-toggle { grid-column:7; grid-row:1; font-size:18px; }
      .history-panel { grid-column:1 / -1; grid-row:2; min-width:0; margin-left:0; padding-right:2px; }
      .history-entry { font-size:11px; line-height:1.45; overflow-wrap:break-word; word-break:normal; }
      .floating-dock { top:auto; bottom:calc(12px + env(safe-area-inset-bottom)); left:12px; right:12px; width:auto; transform:none; padding:5px; border-radius:15px; background:rgba(30,89,99,.18); backdrop-filter:blur(1px); }
      .dock-action { height:44px; padding:7px 10px; font-size:12px; }
      .dock-icon { font-size:20px; }
      .ticker-sheet { top:auto; bottom:calc(69px + env(safe-area-inset-bottom)); height:min(44vh,320px); max-height:min(44vh,320px); }
      .ticker-wheel { height:calc(min(44vh,320px) - 100px); }
    }
  </style>
</head>
<body>
  <main class="home">
    <header class="top">
      <div><div class="eyebrow">ELLIOTT+ STOCK ANALYSIS</div><h1>分析首頁</h1><p class="subtitle">Covered tickers · 點選代號開啟日線分析</p></div>
    </header>
    <section class="section" aria-labelledby="coverage-heading">
      <div class="section-head">
        <strong id="coverage-heading">Coverage</strong>
        <div class="section-head-tools">
          <span id="coverage-count"></span>
          <div class="coverage-tabs" role="tablist" aria-label="Coverage views">
            <button type="button" class="coverage-tab" id="coverage-view-tab" role="tab" aria-selected="true" aria-controls="coverage-view-panel" aria-label="分析檢視" title="分析檢視"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 18V6M4 18h16"/><path d="m7 14 3-3 3 2 5-6"/><path d="M18 7h2v2"/></svg><span class="sr-only">分析檢視</span></button>
            <button type="button" class="coverage-tab" id="coverage-manage-tab" role="tab" aria-selected="false" aria-controls="coverage-manage-panel" aria-label="管理" title="管理"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/></svg><span class="sr-only">管理</span></button>
          </div>
        </div>
      </div>
      <div class="coverage-panel" id="coverage-view-panel" role="tabpanel" aria-labelledby="coverage-view-tab">
        <div class="ticker-list" id="ticker-list"></div>
      </div>
      <div class="coverage-panel" id="coverage-manage-panel" role="tabpanel" aria-labelledby="coverage-manage-tab" hidden>
        <form class="coverage-form" id="coverage-form">
          <input id="new-ticker" placeholder="搜尋／輸入 Ticker，例如：AMD" maxlength="12" autocomplete="off" required>
          <input id="new-company" placeholder="Company name" maxlength="48" autocomplete="organization">
          <select id="new-group" aria-label="Coverage group"><option value="tracking">Tracking · 追蹤</option><option value="exploration">Exploration · 探索</option></select>
          <button class="action" type="submit">Add</button>
        </form>
        <div class="coverage-admin-wrap">
          <div class="coverage-admin" id="coverage-admin"></div>
        </div>
      </div>
    </section>
    <p class="foot">綠點表示有可用的新分析；歷史紀錄採 append-only 保存，點選每列右側「+」即可查看。</p>
  </main>
  <button type="button" class="menu-backdrop" id="menu-backdrop" aria-label="關閉代號選單" hidden></button>
  <section class="ticker-sheet" id="ticker-sheet" aria-label="Ticker selections" hidden>
    <div class="ticker-sheet-head"><div><strong>選擇代號</strong><span>上下捲動或點選以開啟分析</span></div><button type="button" class="ticker-sheet-close" id="ticker-sheet-close" aria-label="關閉代號選單">×</button></div>
    <div class="ticker-wheel" id="ticker-wheel" role="listbox" aria-label="選擇目前代號"></div>
  </section>
  <nav class="floating-dock" aria-label="快速導覽">
    <a class="dock-action" id="dock-home" href="home.html" aria-label="開啟分析首頁"><span class="dock-icon" aria-hidden="true">⌂</span><span>Home</span></a>
    <button type="button" class="dock-action" id="ticker-menu-toggle" aria-expanded="false" aria-controls="ticker-sheet"><span class="dock-icon" aria-hidden="true">⌁</span><span>Ticker</span></button>
  </nav>
  <script>document.write('<script src="../chart-surface/data-contract.js?open=' + Date.now() + '"><\/script>');</script>
  <script src="../chart-surface/analysis-localization.js?open=20260908f"></script>
  <script>
    (async () => {
      const contract = window.PROTOTYPE_DATA_CONTRACT || {};
      const liveProxyUrl = 'https://script.google.com/macros/s/AKfycbwN2nwwPTYSQlYn-SFdKJ4xUFrvEfhsw85TNyWN2SPxmmg735ARE_giwjYiWsePvxRe1w/exec';
      const fetchJsonWithTimeout = async (url, timeoutMs = 2200) => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
          return response.ok ? response.json() : null;
        } finally {
          clearTimeout(timeout);
        }
      };
      const mergeRuntimeContract = (fallback, live) => {
        if (!live || live.error || !Array.isArray(live.coverage)) return fallback;
        const uniqueRuns = new Map();
        const runKey = (run) => run.runId || run.RunID || [run.ticker || run.Ticker, run.analysisDate || run.AnalysisDate, run.runType || run.RunType].filter(Boolean).join('|');
        [...(fallback.analysisRuns || []), ...(live.analysisRuns || [])].forEach((run) => { const key = runKey(run); if (key) uniqueRuns.set(key, run); });
        return {
          ...fallback,
          ...live,
          coverage: live.coverage.length ? live.coverage : fallback.coverage,
          analysisRuns: [...uniqueRuns.values()],
          tables: { ...(fallback.tables || {}), ...(live.tables || {}) },
          datasets: {
            ...(fallback.datasets || {}),
            ...(live.datasets || {}),
            benchmark: { ...(fallback.datasets?.benchmark || {}), ...(live.datasets?.benchmark || {}) },
            weeklyHistory: { ...(fallback.datasets?.weeklyHistory || {}), ...(live.datasets?.weeklyHistory || {}) },
            analysisDetails: { ...(fallback.datasets?.analysisDetails || {}), ...(live.datasets?.analysisDetails || {}) }
          }
        };
      };
      const liveCacheKey = 'stock-analysis-live-contract-v1';
      let activeContract = contract;
      try {
        const cached = JSON.parse(sessionStorage.getItem(liveCacheKey) || 'null');
        if (cached && Array.isArray(cached.coverage)) activeContract = mergeRuntimeContract(contract, cached);
      } catch (_) { /* Ignore an unavailable or malformed browser cache. */ }
      const liveSignature = (live) => JSON.stringify({ coverage: live.coverage || [], analysisRuns: live.analysisRuns || [], tables: live.tables || {} });
      const refreshLiveInBackground = async () => {
        if (window.location.protocol === 'file:') return;
        try {
          const live = await fetchJsonWithTimeout(`${liveProxyUrl}?format=json&refresh=${Date.now()}`, 15000);
          if (!live || !Array.isArray(live.coverage)) return;
          const nextSignature = liveSignature(live);
          const previousSignature = sessionStorage.getItem(`${liveCacheKey}-signature`);
          sessionStorage.setItem(liveCacheKey, JSON.stringify(live));
          sessionStorage.setItem(`${liveCacheKey}-signature`, nextSignature);
          if (nextSignature !== previousSignature) window.location.reload();
        } catch (_) {
          // The already-rendered bundled or cached contract remains usable.
        }
      };
      const datasets = activeContract.datasets?.benchmark || {};
      const partialChartTickers = new Set(['2330', '2646', 'ACHR', 'AMKR', 'CSCO', 'LITE', 'MRVL', 'NOK', 'NVDA', 'ONDS', 'PLTR', 'SNDK']);
      const hasChartData = (ticker) => (Array.isArray(datasets[ticker]?.bars) && datasets[ticker].bars.length >= 2) || partialChartTickers.has(ticker);
      const localizer = window.PROTOTYPE_ANALYSIS_LOCALIZER || {};
      const runs = (activeContract.analysisRuns || []).map((run) => localizer.localizeRun ? localizer.localizeRun(run) : run);
      const baseCoverage = activeContract.coverage || [];
      let overrides = {};
      try { overrides = JSON.parse(localStorage.getItem('stock-analysis-coverage-overrides') || '{}'); } catch { overrides = {}; }
      const allRows = () => {
        const merged = new Map(baseCoverage.map((item) => [item.ticker, { ...item }]));
        Object.entries(overrides).forEach(([ticker, item]) => merged.set(ticker, { ...(merged.get(ticker) || { ticker }), ...item }));
        return [...merged.values()];
      };
      const rows = () => allRows().filter((item) => item.removed !== true);
      const query = new URLSearchParams(window.location.search);
      const coverageMode = query.get('mode') === 'manage' ? 'manage' : 'view';
      const selectedTicker = query.get('ticker') || rows().find((item) => item.active !== false && item.hidden !== true)?.ticker || 'NBIS';
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
      const normalizeCoverageGroup = (value) => ['exploration', 'explore', 'exploratory'].includes(String(value ?? '').trim().toLowerCase()) ? 'exploration' : 'tracking';
      const coverageGroupLabel = (group) => normalizeCoverageGroup(group) === 'exploration' ? 'Exploration · 探索' : 'Tracking · 追蹤';
      const coverageGroup = (item) => normalizeCoverageGroup(item.coverageGroup || item.CoverageGroup || item.group);
      const latestRun = (ticker) => runs.filter((run) => run.ticker === ticker).sort((a, b) => String(b.analysisDate).localeCompare(String(a.analysisDate)))[0];
      const list = document.getElementById('ticker-list');
      const coverage = rows().filter((item) => item.active !== false && item.hidden !== true);
      const trackingCount = coverage.filter((item) => coverageGroup(item) === 'tracking').length;
      const explorationCount = coverage.filter((item) => coverageGroup(item) === 'exploration').length;
      document.getElementById('coverage-count').textContent = `${coverage.length} 個 active ticker · 追蹤 ${trackingCount} · 探索 ${explorationCount}`;
      const currentAnalysis = document.getElementById('current-analysis');
      if (currentAnalysis) currentAnalysis.href = `../chart-surface/index.html?ticker=${encodeURIComponent(selectedTicker)}&view=daily`;
      const renderTickerRows = (items) => items.map((item) => {
        const latest = latestRun(item.ticker);
        const history = runs.filter((run) => run.ticker === item.ticker).sort((a, b) => String(b.analysisDate).localeCompare(String(a.analysisDate)));
        const historyHtml = history.length ? history.map((run) => `<div class="history-entry"><strong>${escapeHtml(run.analysisDate)}</strong> · ${escapeHtml(run.runType === 'latest' ? '最新' : '歷史')} · 信心 ${escapeHtml(localizer.confidenceDisplay ? localizer.confidenceDisplay(run) : (run.confidence ?? run.confidenceLabel ?? '—'))} · ${escapeHtml(run.wyckoff || 'Wyckoff 未標示')}<br>${escapeHtml(run.thesis || run.pattern || '')}</div>`).join('') : '<div class="history-entry">尚無分析紀錄</div>';
        const compactPattern = localizer.compactPattern ? localizer.compactPattern(latest) : (latest?.pattern?.split('｜')[0] || '尚無最新分析');
        const forecast = localizer.direction ? localizer.direction(latest) : { symbol: '→', key: 'flat', label: '延續盤整' };
        const compactDate = latest?.analysisDate ? latest.analysisDate.slice(5).replace('-', '/') : '—';
        const canOpenChart = hasChartData(item.ticker);
        const rowAttributes = canOpenChart
          ? ` class="ticker-row has-detail" data-ticker="${escapeHtml(item.ticker)}" role="button" tabindex="0" aria-label="開啟 ${escapeHtml(item.ticker)} 分析"`
          : ` class="ticker-row is-disabled" title="尚無可用圖表，暫不可開啟"`;
        const confidence = localizer.confidencePercent ? localizer.confidencePercent(latest) : (latest?.confidence ? `${latest.confidence}%` : '—');
        const confidenceTitle = localizer.confidenceDisplay && latest ? `可用信心：${localizer.confidenceDisplay(latest)}` : '';
        const statusTitle = latest ? `新分析：${escapeHtml(latest.analysisDate)}` : (canOpenChart ? '可開啟部分圖表；分析待補' : '尚無可用圖表');
        return `<div${rowAttributes}><span class="new-dot" title="${statusTitle}" ${latest ? '' : 'hidden'}></span><span class="ticker-copy"><strong>${escapeHtml(item.ticker)}</strong></span><span class="latest-pattern" title="${escapeHtml(compactPattern)}">${escapeHtml(compactPattern)}</span><span class="latest-direction" data-direction="${escapeHtml(forecast.key)}" title="${escapeHtml(forecast.label)}" aria-label="${escapeHtml(forecast.label)}">${escapeHtml(forecast.symbol)}</span><span class="latest-confidence" title="${escapeHtml(confidenceTitle)}">${escapeHtml(confidence)}</span><span class="latest-date" title="${latest ? `更新 ${escapeHtml(latest.analysisDate)}` : ''}">${latest ? escapeHtml(compactDate) : '—'}</span><button type="button" class="ticker-history-toggle" aria-label="${escapeHtml(item.ticker)} 分析歷史" aria-controls="history-${escapeHtml(item.ticker)}" aria-expanded="false">+</button><div class="history-panel" id="history-${escapeHtml(item.ticker)}" hidden>${historyHtml}</div></div>`;
      }).join('');
      list.innerHTML = ['tracking', 'exploration'].map((group) => {
        const items = coverage.filter((item) => coverageGroup(item) === group);
        const label = coverageGroupLabel(group);
        const rowsHtml = items.length ? `<div class="coverage-header" role="row"><span aria-hidden="true"></span><span>代號</span><span>型態</span><span title="未來方向預測">預測</span><span>信心 (%)</span><span>更新</span><span aria-hidden="true"></span></div>${renderTickerRows(items)}` : '<p class="coverage-group-empty">尚無 ticker</p>';
        return `<section class="coverage-group" data-group="${group}"><div class="coverage-group-head"><strong>${label}</strong><span>${items.length} 個 ticker</span></div>${rowsHtml}</section>`;
      }).join('');
      list.querySelectorAll('.ticker-row.has-detail[data-ticker]').forEach((row) => {
        const open = () => { window.location.href = `../chart-surface/index.html?ticker=${encodeURIComponent(row.dataset.ticker)}&view=daily`; };
        row.addEventListener('click', (event) => { if (!event.target.closest('.ticker-history-toggle, .history-panel')) open(); });
        row.addEventListener('keydown', (event) => { if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('.ticker-history-toggle, .history-panel')) { event.preventDefault(); open(); } });
      });
      list.querySelectorAll('.ticker-history-toggle').forEach((button) => button.addEventListener('click', () => {
        const panel = button.nextElementSibling;
        const open = panel && !panel.hidden;
        if (panel) panel.hidden = open;
        button.setAttribute('aria-expanded', String(!open));
        button.textContent = open ? '+' : '−';
      }));
      const saveCoverage = () => localStorage.setItem('stock-analysis-coverage-overrides', JSON.stringify(overrides));
      const admin = document.getElementById('coverage-admin');
      const reloadInManagementMode = () => {
        const next = new URL(window.location.href);
        next.searchParams.set('mode', 'manage');
        window.location.href = next.toString();
      };
      const renderCoverageAdmin = () => {
        const adminRows = ['tracking', 'exploration'].map((group) => {
          const groupRows = rows().filter((item) => coverageGroup(item) === group);
          const groupHeader = `<tr class="group-row ${group}"><td colspan="6">${coverageGroupLabel(group)} · ${groupRows.length} 個 ticker</td></tr>`;
          const body = groupRows.map((item) => { const statusClass = item.active === false ? 'status-inactive' : 'status-active'; const status = item.active === false ? 'Inactive' : 'Active'; const actions = `<button type="button" class="action" data-active="${item.active !== false}" data-toggle-ticker="${escapeHtml(item.ticker)}">${item.active === false ? 'Reactivate' : 'Deactivate'}</button><button type="button" class="action" data-remove-ticker="${escapeHtml(item.ticker)}">Remove</button>`; return `<tr><td><strong>${escapeHtml(item.ticker)}</strong></td><td>${escapeHtml(item.company || item.ticker)}</td><td>${escapeHtml(coverageGroupLabel(item))}</td><td>${escapeHtml(item.defaultView || 'daily')}</td><td class="${statusClass}">${status}</td><td>${actions}</td></tr>`; }).join('');
          return groupHeader + body;
        }).join('');
        admin.innerHTML = `<table><thead><tr><th>Ticker</th><th>Company</th><th>Group</th><th>Default view</th><th>Status</th><th>Action</th></tr></thead><tbody>${adminRows}</tbody></table>`;
        admin.querySelectorAll('[data-toggle-ticker]').forEach((button) => button.addEventListener('click', () => {
          const ticker = button.dataset.toggleTicker;
          const current = rows().find((item) => item.ticker === ticker) || { ticker };
          overrides[ticker] = { ...current, active: button.dataset.active !== 'true' };
          saveCoverage();
          reloadInManagementMode();
        }));
        admin.querySelectorAll('[data-remove-ticker]').forEach((button) => button.addEventListener('click', () => {
          const ticker = button.dataset.removeTicker;
          if (!window.confirm(`Remove ${ticker} from Coverage? Historical analyses will be preserved, but the ticker will disappear from Management and selection.`)) return;
          const current = allRows().find((item) => item.ticker === ticker) || { ticker };
          overrides[ticker] = { ...current, hidden: true, removed: true, active: false };
          saveCoverage();
          reloadInManagementMode();
        }));
      };
      renderCoverageAdmin();
      document.getElementById('coverage-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const ticker = document.getElementById('new-ticker').value.trim().toUpperCase();
        if (!ticker) return;
        const current = allRows().find((item) => item.ticker === ticker) || { ticker };
        overrides[ticker] = { ...current, ticker, company: document.getElementById('new-company').value.trim() || current.company || ticker, coverageGroup: document.getElementById('new-group').value, active: true, hidden: false, removed: false, defaultView: current.defaultView || 'daily' };
        saveCoverage();
        reloadInManagementMode();
      });
      const setCoverageMode = (mode) => {
        const manage = mode === 'manage';
        document.getElementById('coverage-view-panel').hidden = manage;
        document.getElementById('coverage-manage-panel').hidden = !manage;
        document.getElementById('coverage-view-tab').setAttribute('aria-selected', String(!manage));
        document.getElementById('coverage-manage-tab').setAttribute('aria-selected', String(manage));
      };
      document.getElementById('coverage-view-tab').addEventListener('click', () => setCoverageMode('view'));
      document.getElementById('coverage-manage-tab').addEventListener('click', () => setCoverageMode('manage'));
      setCoverageMode(coverageMode);
      const closeTickerSheet = () => {
        document.getElementById('ticker-sheet').hidden = true;
        document.getElementById('menu-backdrop').hidden = true;
        document.getElementById('ticker-menu-toggle').setAttribute('aria-expanded', 'false');
      };
      const wheel = document.getElementById('ticker-wheel');
      wheel.replaceChildren(...coverage.map((item) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'ticker-wheel-item' + (item.ticker === selectedTicker ? ' is-current' : '');
        button.dataset.ticker = item.ticker;
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', String(item.ticker === selectedTicker));
        const ticker = document.createElement('strong'); ticker.textContent = item.ticker;
        const company = document.createElement('span'); company.textContent = item.company || item.ticker;
        button.append(ticker, company);
        const canOpenChart = hasChartData(item.ticker);
        button.disabled = !canOpenChart;
        if (!canOpenChart) button.title = '尚無可用圖表，暫不可開啟';
        if (canOpenChart) button.addEventListener('click', () => { window.location.href = `../chart-surface/index.html?ticker=${encodeURIComponent(item.ticker)}&view=daily`; });
        return button;
      }));
      const currentItem = wheel.querySelector('.is-current');
      if (currentItem) wheel.scrollTop = Math.max(0, currentItem.offsetTop - wheel.clientHeight / 2 + currentItem.offsetHeight / 2);
      document.getElementById('ticker-menu-toggle').addEventListener('click', () => {
        const sheet = document.getElementById('ticker-sheet');
        const open = sheet.hidden;
        sheet.hidden = !open;
        document.getElementById('menu-backdrop').hidden = !open;
        document.getElementById('ticker-menu-toggle').setAttribute('aria-expanded', String(open));
      });
      document.getElementById('ticker-sheet-close').addEventListener('click', closeTickerSheet);
      document.getElementById('menu-backdrop').addEventListener('click', closeTickerSheet);
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !document.getElementById('ticker-sheet').hidden) closeTickerSheet(); });
      void refreshLiveInBackground();
    })();
  </script>
</body>
</html>
