<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="E+">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/elliott-asterisk-icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/elliott-asterisk-apple-touch-icon.png">
  <script src="../pwa-register.js" defer></script>
  <title>股市分析</title>
  <style>
    :root { color-scheme:dark; --bg:#071018; --surface:#0d1a25; --surface2:#112433; --line:#203849; --text:#edf6fb; --muted:#91a8b7; --aqua:#55d9d5; --lime:#c8f169; --amber:#f2b84b; --rose:#ff7e8f; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); }
    body { min-height:100vh; min-height:100dvh; margin:0; padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(82px + env(safe-area-inset-bottom)) env(safe-area-inset-left); overflow-x:hidden; background:radial-gradient(circle at 90% -10%,rgba(85,217,213,.12),transparent 34%),var(--bg); color:var(--text); font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-text-size-adjust:100%; }
    button, a { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    a { color:var(--aqua); }
    .shell { width:min(920px,100%); margin:0 auto; padding:24px 18px 44px; }
    .masthead { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:22px; }
    .eyebrow { color:var(--aqua); font-size:11px; font-weight:800; letter-spacing:.11em; }
    h1 { margin:3px 0 2px; font-size:clamp(27px,5vw,38px); line-height:1.15; }
    .dek { margin:0; color:var(--muted); font-size:13px; }
    .network { display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; color:var(--muted); font-size:11px; }
    .network::before { width:7px; height:7px; border-radius:50%; background:var(--lime); content:""; }
    .network.is-offline::before { background:var(--amber); }
    .calendar-menu { display:grid; gap:10px; margin:0 0 18px; padding:12px; border:1px solid var(--line); border-radius:16px; background:rgba(13,26,37,.84); overflow-x:auto; }
    .calendar-week { display:grid; grid-template-columns:repeat(7,minmax(34px,1fr)); align-items:center; gap:3px; min-width:252px; }
    .calendar-day { position:relative; display:grid; place-items:center; gap:1px; min-height:58px; padding:5px 2px 10px; border:1px solid transparent; border-radius:11px; color:var(--muted); background:transparent; cursor:pointer; }
    .calendar-day:hover, .calendar-day:focus-visible { border-color:rgba(85,217,213,.45); outline:0; }
    .calendar-day[aria-pressed="true"] { color:#071018; background:var(--aqua); }
    .calendar-day-name { font-size:10px; font-weight:750; }
    .calendar-day-number { font-size:16px; font-weight:900; line-height:1.15; }
    .calendar-day.has-digest::after { position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:var(--lime); content:""; box-shadow:0 0 8px rgba(200,241,105,.6); }
    .calendar-day[aria-pressed="true"]::after { background:#071018; box-shadow:none; }
    .calendar-day:not(.has-digest):not([aria-pressed="true"]) { opacity:.52; }
    .selected-date { margin:0 0 10px; color:var(--muted); font-size:12px; font-weight:800; }
    .status-card, .group, .reader { border:1px solid var(--line); border-radius:16px; background:rgba(13,26,37,.9); box-shadow:0 16px 40px rgba(0,0,0,.16); }
    .status-card { padding:22px; color:var(--muted); }
    .status-card strong { display:block; margin-bottom:4px; color:var(--text); font-size:17px; }
    .digest-list { display:grid; gap:14px; }
    .group { overflow:hidden; }
    .group-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:13px 15px; border-bottom:1px solid var(--line); }
    .group-head time { color:var(--text); font-weight:850; }
    .group-head span { color:var(--muted); font-size:11px; }
    .edition-list { display:grid; }
    .edition-card { display:grid; grid-template-columns:auto 1fr auto; align-items:start; gap:12px; width:100%; min-height:66px; padding:14px 15px; border:0; border-bottom:1px solid rgba(32,56,73,.72); color:var(--text); background:transparent; text-align:left; cursor:pointer; }
    .edition-card:last-child { border-bottom:0; }
    .edition-card:hover, .edition-card:focus-visible { background:rgba(85,217,213,.07); outline:0; }
    .edition-card.is-missing { cursor:default; opacity:.42; }
    .edition-card.is-missing:hover { background:transparent; }
    .edition-badge { min-width:76px; padding:4px 7px; border:1px solid rgba(85,217,213,.35); border-radius:999px; color:var(--aqua); font-size:11px; font-weight:800; text-align:center; }
    .edition-card[data-edition="close"] .edition-badge, .edition-card[data-edition="weekly"] .edition-badge { border-color:rgba(200,241,105,.36); color:var(--lime); }
    .edition-copy { min-width:0; }
    .edition-copy strong { display:block; font-size:14px; }
    .edition-copy span { display:-webkit-box; margin-top:3px; overflow:hidden; color:var(--muted); font-size:12px; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .edition-time { color:var(--muted); font-size:11px; white-space:nowrap; }
    .reader[hidden], .list-view[hidden] { display:none; }
    .reader { overflow:visible; }
    .reader-toolbar { position:sticky; top:calc(env(safe-area-inset-top) + 6px); z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 13px; border:1px solid var(--line); border-radius:14px; background:rgba(13,26,37,.97); box-shadow:0 10px 28px rgba(0,0,0,.28); backdrop-filter:blur(12px); }
    .back { display:inline-flex; min-height:44px; align-items:center; gap:7px; border:0; color:var(--aqua); background:transparent; font-weight:800; cursor:pointer; }
    .reader-position { color:var(--muted); font-size:11px; }
    .article { width:min(720px,100%); margin:0 auto; padding:26px 22px 40px; overflow-wrap:anywhere; }
    .article-kicker { display:flex; flex-wrap:wrap; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .article h2 { margin:9px 0 7px; font-size:clamp(24px,5vw,34px); line-height:1.2; }
    .meta { margin:0 0 22px; color:var(--muted); font-size:12px; }
    .summary { margin:0 0 24px; padding:16px 17px; border-left:3px solid var(--aqua); border-radius:0 12px 12px 0; background:rgba(85,217,213,.07); font-size:16px; line-height:1.75; }
    .article section { margin-top:28px; }
    .article h3 { margin:0 0 10px; color:var(--aqua); font-size:17px; }
    .article p { margin:0 0 12px; }
    .article ul { margin:0; padding-left:1.3em; }
    .article li + li { margin-top:8px; }
    .table-wrap { width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:11px; }
    table { width:100%; min-width:520px; border-collapse:collapse; font-size:13px; }
    th, td { padding:10px 11px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--aqua); background:var(--surface2); }
    tr:last-child td { border-bottom:0; }
    .source-list { display:grid; gap:8px; padding:0; list-style:none; }
    .source-list a { display:inline-block; min-height:44px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; text-decoration:none; }
    .source-list a:hover, .source-list a:focus-visible { border-color:var(--aqua); }
    @media (min-width:760px) {
      body { padding-bottom:24px; }
      .shell { padding:34px 28px 54px; }
      .reader-toolbar { top:82px; }
      .article { padding:38px 42px 54px; }
    }
    @media (max-width:520px) {
      .shell { padding:18px 12px 36px; }
      .masthead { align-items:flex-start; }
      .edition-card { grid-template-columns:1fr auto; gap:7px 10px; }
      .edition-badge { grid-column:1; justify-self:start; min-width:0; }
      .edition-copy { grid-column:1 / -1; grid-row:2; }
      .edition-time { grid-column:2; grid-row:1; }
      .article { padding:22px 16px 36px; }
      .summary { font-size:15px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div><div class="eyebrow">ELLIOTT+ · MARKET BRIEF</div><h1>跨市場摘要</h1><p class="dek">每日訊號與每週展望，集中閱讀。</p></div>
      <span class="network" id="network-state" role="status">已連線</span>
    </header>

    <div class="list-view" id="list-view">
      <div class="calendar-menu" id="calendar-menu" aria-label="最近兩週摘要日期"></div>
      <p class="selected-date" id="selected-date"></p>
      <div class="digest-list" id="digest-list" aria-live="polite">
        <div class="status-card"><strong>正在整理摘要</strong>請稍候。</div>
      </div>
    </div>

    <article class="reader" id="reader" aria-live="polite" hidden>
      <div class="reader-toolbar"><button class="back" id="reader-back" type="button">← 摘要列表</button><span class="reader-position" id="reader-position"></span></div>
      <div class="article" id="article"></div>
    </article>
  </main>

  <script src="../coverage-order.js?v=20260909-v1"></script>
  <script src="../shared-menu.js?v=20260910-3"></script>
  <elliott-shared-menu data-current="home" data-home-href="home.html" data-coverage-href="coverage.html" data-ticker-href="../chart-surface/index.html" data-ticker-page-href="../chart-surface/index.html"></elliott-shared-menu>

  <script src="digest-model.js?v=20260910-2"></script>
  <script src="digest-data.js?v=20260910-2"></script>
  <script>
    (() => {
      const model = window.ELLIOTT_DIGEST_MODEL;
      const dataset = model.normalizeDataset(window.ELLIOTT_CROSS_MARKET_DIGESTS);
      const listView = document.getElementById('list-view');
      const list = document.getElementById('digest-list');
      const calendar = document.getElementById('calendar-menu');
      const selectedDateLabel = document.getElementById('selected-date');
      const reader = document.getElementById('reader');
      const article = document.getElementById('article');
      const position = document.getElementById('reader-position');
      const query = new URLSearchParams(window.location.search);
      const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      const fromDateKey = (value) => new Date(`${value}T12:00:00`);
      const today = dateKey(new Date());
      let selectedDate = /^\d{4}-\d{2}-\d{2}$/.test(query.get('date') || '') ? query.get('date') : today;

      const text = (tag, value, className) => {
        const element = document.createElement(tag);
        element.textContent = value ?? '';
        if (className) element.className = className;
        return element;
      };
      const validLink = (value) => {
        try { const url = new URL(value, window.location.href); return ['http:', 'https:'].includes(url.protocol) ? url.href : null; } catch (_) { return null; }
      };
      const formatDate = (value, options = {}) => {
        const date = new Date(`${value}T12:00:00`);
        return Number.isNaN(date.getTime()) ? value : new Intl.DateTimeFormat('zh-TW', { year:'numeric', month:'long', day:'numeric', ...options }).format(date);
      };
      const formatTime = (value) => {
        const date = new Date(value || '');
        return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'America/Los_Angeles' }).format(date);
      };
      const updateUrl = (changes, mode = 'push') => {
        const url = new URL(window.location.href);
        Object.entries(changes).forEach(([key, value]) => value ? url.searchParams.set(key, value) : url.searchParams.delete(key));
        history[mode === 'replace' ? 'replaceState' : 'pushState']({}, '', url);
      };
      const saveScroll = () => sessionStorage.setItem(`digest-scroll-${selectedDate}`, String(window.scrollY));
      const restoreScroll = () => requestAnimationFrame(() => window.scrollTo({ top:Number(sessionStorage.getItem(`digest-scroll-${selectedDate}`) || 0), behavior:'auto' }));

      function calendarWeeks() {
        const current = fromDateKey(today);
        const thisSunday = new Date(current);
        thisSunday.setDate(current.getDate() - current.getDay());
        return [-7, 0].map((offset) => {
          const start = new Date(thisSunday);
          start.setDate(thisSunday.getDate() + offset);
          return Array.from({ length:7 }, (_, index) => {
            const day = new Date(start);
            day.setDate(start.getDate() + index);
            return dateKey(day);
          });
        });
      }

      function renderCalendar() {
        const daysWithDigests = new Set(dataset.records.filter((record) => record.cadence === 'daily').map((record) => record.marketDate));
        calendar.replaceChildren();
        calendarWeeks().forEach((days) => {
          const row = text('div', '', 'calendar-week');
          days.forEach((value) => {
            const date = fromDateKey(value);
            const button = text('button', '', 'calendar-day');
            button.type = 'button';
            button.dataset.date = value;
            button.classList.toggle('has-digest', daysWithDigests.has(value));
            button.setAttribute('aria-pressed', String(value === selectedDate));
            button.setAttribute('aria-label', `${formatDate(value, { weekday:'long' })}${daysWithDigests.has(value) ? '，有摘要' : '，尚無摘要'}`);
            button.append(text('span', new Intl.DateTimeFormat('en-US', { weekday:'short' }).format(date), 'calendar-day-name'));
            button.append(text('span', String(date.getDate()), 'calendar-day-number'));
            button.addEventListener('click', () => {
              if (value === selectedDate) return;
              saveScroll();
              selectedDate = value;
              updateUrl({ view:'daily', date:selectedDate, digest:null });
              renderCalendar();
              renderList();
              restoreScroll();
            });
            row.append(button);
          });
          calendar.append(row);
        });
      }

      function emptyState() {
        list.replaceChildren();
        const card = text('div', '', 'status-card');
        card.append(text('strong', dataset.error ? '摘要資料暫時無法讀取' : '尚未有摘要'));
        card.append(document.createTextNode(dataset.error ? '請稍後重新整理；Coverage 與既有分析仍可使用。' : '這一天尚未發布摘要。上方亮點標記代表已有內容的日期。'));
        list.append(card);
      }

      function renderList() {
        reader.hidden = true;
        listView.hidden = false;
        selectedDateLabel.textContent = formatDate(selectedDate, { weekday:'long' });
        const records = dataset.records.filter((record) => record.cadence === 'daily' && record.marketDate === selectedDate);
        list.replaceChildren();
        const byEdition = new Map(records.map((record) => [record.edition, record]));
        if (!records.length) { emptyState(); return; }
        const editionOrder = ['close', 'midday', 'morning'];
        const available = editionOrder.map((edition) => byEdition.get(edition)).filter(Boolean);
        const missing = editionOrder.filter((edition) => !byEdition.has(edition)).map((edition) => ({ edition }));
        [{ key:selectedDate, items:[...available, ...missing] }].forEach((group) => {
          const section = text('section', '', 'group');
          const head = text('div', '', 'group-head');
          head.append(text('time', 'Daily · 每日摘要'));
          head.append(text('span', `${records.length} / 3 篇`));
          section.append(head);
          const editions = text('div', '', 'edition-list');
          group.items.forEach((record) => {
            const button = text('button', '', 'edition-card');
            button.type = 'button';
            button.dataset.edition = record.edition;
            if (!record.id) {
              button.disabled = true;
              button.classList.add('is-missing');
              button.setAttribute('aria-label', `${model.EDITION_LABELS[record.edition]}尚未發布`);
            } else {
            button.setAttribute('aria-label', `開啟 ${model.EDITION_LABELS[record.edition]}：${record.title}`);
            }
            button.append(text('span', model.EDITION_LABELS[record.edition], 'edition-badge'));
            const copy = text('span', '', 'edition-copy');
            copy.append(text('strong', record.title || '尚未發布'));
            copy.append(text('span', record.id ? (record.summary || '開啟閱讀完整摘要') : '這個時段目前沒有摘要'));
            button.append(copy);
            button.append(text('time', record.id ? formatTime(record.publishedAt) : '—', 'edition-time'));
            if (record.id) button.addEventListener('click', () => openReader(record, true));
            editions.append(button);
          });
          section.append(editions);
          list.append(section);
        });
      }

      function renderTable(table) {
        if (!table || !Array.isArray(table.columns) || !Array.isArray(table.rows)) return null;
        const wrap = text('div', '', 'table-wrap');
        const node = document.createElement('table');
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        table.columns.forEach((column) => headRow.append(text('th', column)));
        thead.append(headRow);
        const tbody = document.createElement('tbody');
        table.rows.forEach((row) => {
          const tr = document.createElement('tr');
          table.columns.forEach((_, index) => tr.append(text('td', Array.isArray(row) ? row[index] : '')));
          tbody.append(tr);
        });
        node.append(thead, tbody);
        wrap.append(node);
        return wrap;
      }

      function renderLinks(links) {
        const valid = (links || []).map((item) => ({ ...item, href:validLink(item.url) })).filter((item) => item.href);
        if (!valid.length) return null;
        const ul = text('ul', '', 'source-list');
        valid.forEach((item) => {
          const li = document.createElement('li');
          const anchor = text('a', item.label || item.href);
          anchor.href = item.href;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          li.append(anchor);
          ul.append(li);
        });
        return ul;
      }

      function openReader(record, push) {
        saveScroll();
        listView.hidden = true;
        reader.hidden = false;
        article.replaceChildren();
        const kicker = text('div', '', 'article-kicker');
        kicker.append(text('span', model.EDITION_LABELS[record.edition], 'edition-badge'));
        kicker.append(text('time', record.cadence === 'weekly' ? formatDate(record.weekStart) : formatDate(record.marketDate)));
        article.append(kicker, text('h2', record.title));
        const meta = [record.publishedAt ? `發布 ${formatTime(record.publishedAt)} PT` : '', record.sourceCutoff ? `資料截止 ${record.sourceCutoff}` : '', record.timezone].filter(Boolean).join(' · ');
        article.append(text('p', meta, 'meta'));
        if (record.summary) article.append(text('p', record.summary, 'summary'));
        record.sections.forEach((data) => {
          const section = document.createElement('section');
          if (data.heading) section.append(text('h3', data.heading));
          (data.paragraphs || []).forEach((paragraph) => section.append(text('p', paragraph)));
          if (Array.isArray(data.points) && data.points.length) {
            const ul = document.createElement('ul');
            data.points.forEach((point) => ul.append(text('li', point)));
            section.append(ul);
          }
          const table = renderTable(data.table);
          if (table) section.append(table);
          const links = renderLinks(data.links);
          if (links) section.append(links);
          article.append(section);
        });
        const sources = renderLinks(record.sources);
        if (sources) {
          const section = document.createElement('section');
          section.append(text('h3', '來源'));
          section.append(sources);
          article.append(section);
        }
        const ordered = dataset.records.filter((item) => item.cadence === record.cadence);
        position.textContent = `${ordered.findIndex((item) => item.id === record.id) + 1} / ${ordered.length}`;
        if (record.marketDate) selectedDate = record.marketDate;
        if (push) updateUrl({ view:record.cadence, date:record.marketDate || selectedDate, digest:record.id });
        document.title = `${record.title} · 股市分析`;
        window.scrollTo({ top:0, behavior:'auto' });
      }

      function closeReader(push) {
        if (push) updateUrl({ view:'daily', date:selectedDate, digest:null });
        document.title = '股市分析';
        renderCalendar();
        renderList();
        restoreScroll();
      }

      document.getElementById('reader-back').addEventListener('click', () => closeReader(true));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !reader.hidden) closeReader(true);
      });
      window.addEventListener('popstate', () => {
        const current = new URLSearchParams(window.location.search);
        selectedDate = /^\d{4}-\d{2}-\d{2}$/.test(current.get('date') || '') ? current.get('date') : today;
        const record = model.recordById(dataset.records, current.get('digest'));
        if (record) openReader(record, false); else { renderCalendar(); closeReader(false); }
      });
      const updateNetwork = () => {
        const node = document.getElementById('network-state');
        const online = navigator.onLine;
        node.textContent = online ? '已連線' : '離線閱讀';
        node.classList.toggle('is-offline', !online);
      };
      window.addEventListener('online', updateNetwork);
      window.addEventListener('offline', updateNetwork);
      updateNetwork();

      const initial = model.recordById(dataset.records, query.get('digest'));
      if (initial) {
        if (initial.marketDate) selectedDate = initial.marketDate;
        openReader(initial, false);
      } else {
        updateUrl({ view:'daily', date:selectedDate, digest:null }, 'replace');
        renderCalendar();
        renderList();
        restoreScroll();
      }
    })();
  </script>
</body>
</html>
