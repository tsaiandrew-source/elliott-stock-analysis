<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>E+ 市場摘要</title>
  <link rel="stylesheet" href="../shared-topbar.css?v=20260923-1">
  <script src="../shared-topbar.js?v=20260923-2" defer></script>
  <style>
    :root {
      color-scheme:light dark;
      --background:light-dark(rgb(255 255 255),rgb(24 24 24));
      --foreground:light-dark(rgb(26 28 31),rgb(255 255 255));
      --card:color-mix(in oklab,var(--foreground) 5%,var(--background));
      --card-foreground:var(--foreground);
      --popover:light-dark(rgb(255 255 255),rgb(45 45 45));
      --primary:light-dark(rgb(51 156 255),rgb(131 195 255));
      --primary-foreground:light-dark(rgb(255 255 255),rgb(13 13 13));
      --secondary:light-dark(rgb(255 255 255 / 96%),rgb(54 54 54 / 96%));
      --muted:color-mix(in srgb,var(--foreground) 10%,transparent);
      --muted-foreground:light-dark(rgb(26 28 31 / 49.4%),rgb(255 255 255 / 49.8%));
      --accent:light-dark(rgb(229 242 255),rgb(13 39 63));
      --accent-foreground:var(--primary);
      --destructive:light-dark(rgb(226 85 7),rgb(255 133 73));
      --border:light-dark(rgb(26 28 31 / 8%),rgb(255 255 255 / 8.2%));
      --ring:light-dark(rgb(51 156 255),rgb(131 195 255 / 76%));
      --green:light-dark(rgb(0 162 64),rgb(64 201 119));
      --orange:light-dark(rgb(226 85 7),rgb(251 106 34));
      --red:light-dark(rgb(224 46 42),rgb(255 103 100));
      --purple:light-dark(rgb(146 79 247),rgb(173 123 249));
      --font-sans:-apple-system,system-ui,"Segoe UI",sans-serif;
      --font-size-base:14px;
      --font-weight-normal:430;
      --font-weight-medium:500;
      --content-max:900px;
      --radius:10px;
      --radius-sm:6px;
      --radius-md:8px;
      --radius-2xl:16px;
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--background); }
    body { min-height:100vh; min-height:100dvh; margin:0; padding:calc(var(--shared-topbar-height) + env(safe-area-inset-top) + 16px) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); overflow-x:hidden; background:var(--background); color:var(--foreground); font-family:var(--font-sans); font-size:var(--font-size-base); font-weight:var(--font-weight-normal); line-height:1.5; -webkit-text-size-adjust:100%; }
    button, a { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    a { color:color-mix(in srgb,var(--primary) 80%,var(--foreground) 20%); font-weight:var(--font-weight-medium); text-decoration:none; text-underline-offset:2px; }
    a:is(:hover,:focus-visible) { text-decoration:underline dashed .5px; }
    strong, th { font-weight:var(--font-weight-medium); }
    .shell { width:min(var(--content-max),100%); margin:0 auto; padding:0; }
    .day-summary { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:.4rem 1rem; margin:0; padding:0 0 .8rem; border-bottom:1px solid var(--border); }
    .day-summary strong { font-size:1.08rem; }
    .day-summary span { color:var(--muted-foreground); font-size:.86rem; text-align:right; }
    .status-card { padding:12px; border-radius:var(--radius-2xl); color:var(--muted-foreground); background:var(--card); }
    .status-card strong { display:block; margin-bottom:4px; color:var(--foreground); font-size:1.08rem; }
    .digest-list { display:grid; gap:14px; min-width:0; }
    .group { min-width:0; overflow:hidden; }
    .group-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:.8rem 0; border-bottom:1px solid var(--border); }
    .group-head strong { color:var(--foreground); font-weight:var(--font-weight-medium); }
    .group-head span { color:var(--muted-foreground); font-size:.82rem; }
    .edition-list { display:grid; }
    .edition-card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:start; gap:12px; width:100%; min-height:64px; padding:12px 0; border:0; border-bottom:1px solid var(--border); color:var(--foreground); background:transparent; text-align:left; cursor:pointer; }
    .edition-card:last-child { border-bottom:0; }
    .edition-card:hover { background:color-mix(in srgb,var(--muted-foreground) 6%,transparent); }
    .edition-card:focus-visible, .source-list a:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
    .edition-card.is-missing { cursor:default; opacity:.42; }
    .edition-card.is-missing:hover { background:transparent; }
    .edition-card[aria-expanded="true"] { background:color-mix(in srgb,var(--primary) 10%,var(--background)); box-shadow:inset 3px 0 var(--primary); }
    .edition-details { margin:10px 0; border-radius:var(--radius-2xl); background:var(--card); }
    .article.edition-details { padding-top:16px; }
    .edition-details > section:first-child { margin-top:0; }
    .edition-badge { display:inline-flex; min-height:1.65rem; align-items:center; justify-content:center; padding:.1rem .5rem; border-radius:999px; color:var(--primary); background:color-mix(in srgb,currentColor 11%,transparent); font-size:.78rem; font-weight:600; white-space:nowrap; }
    .edition-card[data-edition="close"] .edition-badge, .edition-card[data-edition="weekly"] .edition-badge { color:var(--green); }
    .edition-copy { min-width:0; }
    .edition-copy strong { display:block; font-size:1rem; }
    .edition-copy span { display:-webkit-box; margin-top:3px; overflow:hidden; color:var(--muted-foreground); line-height:1.5; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .edition-card[aria-expanded="true"] .edition-copy span { display:none; }
    .edition-meta { display:inline-flex; align-items:center; gap:10px; }
    .edition-time { color:var(--muted-foreground); font-size:.78rem; white-space:nowrap; }
    .disclosure { width:8px; height:8px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; color:var(--muted-foreground); transform:rotate(45deg) translateY(-2px); transition:transform 160ms ease; }
    .edition-card[aria-expanded="true"] .disclosure { transform:rotate(225deg) translate(-1px,-1px); }
    .list-view[hidden] { display:none; }
    .article { width:100%; min-width:0; margin:10px 0; padding:16px; overflow-wrap:anywhere; }
    .article section { margin-top:24px; }
    .article h3 { margin:0 0 10px; color:var(--foreground); font-size:1.14rem; font-weight:var(--font-weight-medium); }
    .article p { margin:0 0 12px; }
    .article ul { margin:0; padding-left:1.3em; }
    .article li + li { margin-top:8px; }
    .table-wrap { width:100%; overflow-x:auto; scrollbar-width:thin; }
    table { width:100%; max-width:100%; min-width:0; border-collapse:collapse; font-size:13px; }
    th, td { padding:10px 24px 10px 0; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; overflow-wrap:anywhere; }
    th:last-child, td:last-child { padding-right:0; }
    th { color:var(--foreground); background:transparent; }
    tr:last-child td { border-bottom:0; }
    .article .source-list { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:8px 0 0; padding:0; list-style:none; }
    .article .source-list li, .article .source-list li + li { display:flex; align-items:center; margin:0; }
    .source-list a { display:inline-flex; min-height:32px; align-items:center; padding:5px 9px; border:1px solid var(--border); border-radius:var(--radius-md); color:var(--foreground); background:var(--background); font-size:.86rem; line-height:1.2; }
    .source-list a:hover { background:color-mix(in srgb,var(--muted-foreground) 10%,var(--background)); text-decoration:none; }
    .reader-close { display:inline-flex; min-width:44px; min-height:44px; align-items:center; justify-content:center; margin-top:24px; padding:8px 14px; border:1px solid var(--border); border-radius:var(--radius-md); color:var(--foreground); background:var(--background); cursor:pointer; }
    .reader-close:hover { background:var(--accent); }
    .reader-close:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
    @media (max-width:1024px) {
      .table-wrap { overflow:visible; border:0; }
      .article table, .article tbody { display:block; width:100%; }
      .article thead { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
      .article tbody { display:grid; gap:10px; }
      .article tbody tr { display:block; margin:0 0 1rem; padding:.5rem 0; border-top:1px solid var(--border); }
      .article tbody td { display:grid; grid-template-columns:minmax(5.75rem,32%) minmax(0,1fr); gap:.5rem; min-height:44px; padding:10px 0; border-bottom:1px solid var(--border); white-space:normal; }
      .article tbody td::before { content:attr(data-label); color:var(--muted-foreground); font-weight:var(--font-weight-medium); }
      .article tbody td:last-child { border-bottom:0; }
    }
    @media (max-width:620px) {
      .day-summary { display:grid; gap:3px; }
      .day-summary span { text-align:left; }
      .edition-card { grid-template-columns:1fr auto; gap:7px 10px; }
      .edition-badge { grid-column:1; justify-self:start; min-width:0; }
      .edition-copy { grid-column:1 / -1; grid-row:2; }
      .edition-time { grid-column:2; grid-row:1; }
      .article { padding:14px 12px 24px; }
    }
    @media (pointer:coarse) {
      .edition-card, .source-list a, .reader-close { min-width:44px; min-height:44px; }
    }
  </style>
</head>
<body>
  <elliott-topbar data-current="digest" data-digest-href="home.html" data-moomoo-href="../moomoo-patterns.html" data-exploration-href="../social-exploration.html"></elliott-topbar>
  <main class="shell">
    <div class="list-view" id="list-view">
      <section class="day-summary" aria-label="今日摘要排程"><strong id="selected-date"></strong><span id="day-cadence"></span></section>
      <div class="digest-list" id="digest-list" aria-live="polite">
        <div class="status-card"><strong>正在整理摘要</strong>請稍候。</div>
      </div>
    </div>

  </main>

  <script src="digest-model.js?v=20260910-2"></script>
  <script src="digest-data.js?v=20260910-2"></script>
  <script>
    (async () => {
      await (window.__ELLIOTT_DESKTOP_DATA_READY__ || Promise.resolve());
      window.__ELLIOTT_DESKTOP_APPLY_DATA__?.();
      const model = window.ELLIOTT_DIGEST_MODEL;
      const dataset = model.normalizeDataset(window.ELLIOTT_CROSS_MARKET_DIGESTS);
      const listView = document.getElementById('list-view');
      const list = document.getElementById('digest-list');
      const selectedDateLabel = document.getElementById('selected-date');
      const dayCadenceLabel = document.getElementById('day-cadence');
      const canonicalUrl = new URL(window.location.href);
      const desktopRuntime = canonicalUrl.searchParams.get('runtime') === 'tauri';
      const hasNonRuntimeQuery = [...canonicalUrl.searchParams.keys()].some((key) => key !== 'runtime');
      if (hasNonRuntimeQuery || (canonicalUrl.search && !desktopRuntime)) {
        const canonicalSearch = desktopRuntime ? '?runtime=tauri' : '';
        history.replaceState({}, '', `${canonicalUrl.pathname}${canonicalSearch}${canonicalUrl.hash}`);
      }
      const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      const fromDateKey = (value) => new Date(`${value}T12:00:00`);
      const today = dateKey(new Date());
      const selectedDate = today;

      const text = (tag, value, className) => {
        const element = document.createElement(tag);
        element.textContent = value ?? '';
        if (className) element.className = className;
        return element;
      };
      const validLink = (value) => {
        try { const url = new URL(value, window.location.href); return ['http:', 'https:'].includes(url.protocol) ? url.href : null; } catch (_) { return null; }
      };
      const formatDate = (value, options = {}) => {
        const date = new Date(`${value}T12:00:00`);
        return Number.isNaN(date.getTime()) ? value : new Intl.DateTimeFormat('zh-TW', { year:'numeric', month:'long', day:'numeric', ...options }).format(date);
      };
      const formatTime = (value) => {
        const date = new Date(value || '');
        return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'America/Los_Angeles' }).format(date);
      };
      const displayDateFor = (record) => {
        if (record.cadence === 'weekly') {
          const published = new Date(record.publishedAt || '');
          return Number.isNaN(published.getTime()) ? '' : dateKey(published);
        }
        return record.marketDate || '';
      };
      const editionLabel = (edition) => model.EDITION_LABELS[edition];
      const scrollKey = () => `digest-scroll-daily-${selectedDate}`;
      const saveScroll = () => sessionStorage.setItem(scrollKey(), String(window.scrollY));
      const restoreScroll = () => requestAnimationFrame(() => window.scrollTo({ top:Number(sessionStorage.getItem(scrollKey()) || 0), behavior:'auto' }));

      const isWeekend = (value) => [0, 6].includes(fromDateKey(value).getDay());
      const displayEditionLabel = (edition) => isWeekend(selectedDate) && ['close', 'weekly'].includes(edition)
        ? 'End of day · 週末收盤'
        : editionLabel(edition);

      function emptyState() {
        list.replaceChildren();
        const card = text('div', '', 'status-card');
        card.append(text('strong', dataset.error ? '摘要資料暫時無法讀取' : '尚未有摘要'));
        card.append(document.createTextNode(dataset.error ? '請稍後重新整理。' : '今日摘要尚未發布。'));
        list.append(card);
      }

      function renderList() {
        listView.hidden = false;
        selectedDateLabel.textContent = formatDate(selectedDate, { weekday:'long' });
        const weekend = isWeekend(selectedDate);
        dayCadenceLabel.textContent = weekend ? '週末 · 收盤後一篇 · 16:00 PT' : '平日 · 盤前／盤中／收盤';
        const records = dataset.records.filter((record) => record.cadence === 'daily' && record.marketDate === selectedDate);
        const weeklyRecords = dataset.records.filter((record) => record.cadence === 'weekly' && displayDateFor(record) === selectedDate);
        list.replaceChildren();
        const byEdition = new Map([...records, ...weeklyRecords].map((record) => [record.edition, record]));
        if (dataset.error) { emptyState(); return; }
        const editionOrder = weekend ? ['close'] : ['close', 'midday', 'morning'];
        const available = editionOrder.map((edition) => byEdition.get(edition)).filter(Boolean);
        if (weekend && !available.length && weeklyRecords.length) available.push(weeklyRecords[0]);
        const presentEditions = new Set(available.map((record) => record.edition === 'weekly' ? 'close' : record.edition));
        const missing = editionOrder.filter((edition) => !presentEditions.has(edition)).map((edition) => ({ edition }));
        [{ key:selectedDate, items:[...available, ...missing] }].forEach((group) => {
          const section = text('section', '', 'group');
          const head = text('div', '', 'group-head');
          head.append(text('strong', '今日摘要'));
          head.append(text('span', `已發布 ${available.length} / ${editionOrder.length} 篇`));
          section.append(head);
          const editions = text('div', '', 'edition-list');
          group.items.forEach((record) => {
            const button = text('button', '', 'edition-card');
            button.type = 'button';
            button.dataset.edition = record.edition;
            if (!record.id) {
              button.disabled = true;
              button.classList.add('is-missing');
              button.setAttribute('aria-label', `${displayEditionLabel(record.edition)}尚未發布`);
            } else {
            button.dataset.recordId = record.id;
            button.dataset.closedLabel = `展開 ${displayEditionLabel(record.edition)}：${record.title}`;
            button.setAttribute('aria-expanded', 'false');
            button.setAttribute('aria-controls', `digest-panel-${record.id}`);
            button.setAttribute('aria-label', button.dataset.closedLabel);
            }
            button.append(text('span', displayEditionLabel(record.edition), 'edition-badge'));
            const copy = text('span', '', 'edition-copy');
            copy.append(text('strong', record.title || '尚未發布'));
            copy.append(text('span', record.id ? (record.summary || '開啟閱讀完整摘要') : '這個時段目前沒有摘要'));
            button.append(copy);
            const meta = text('span', '', 'edition-meta');
            meta.append(text('time', record.id ? formatTime(record.publishedAt) : '—', 'edition-time'));
            if (record.id) meta.append(text('span', '', 'disclosure'));
            button.append(meta);
            if (record.id) button.addEventListener('click', () => {
              if (button.getAttribute('aria-expanded') === 'true') closeReader();
              else openReader(record);
            });
            editions.append(button);
          });
          section.append(editions);
          list.append(section);
        });
      }

      function renderTable(table) {
        if (!table || !Array.isArray(table.columns) || !Array.isArray(table.rows)) return null;
        const wrap = text('div', '', 'table-wrap');
        const node = document.createElement('table');
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        table.columns.forEach((column) => headRow.append(text('th', column)));
        thead.append(headRow);
        const tbody = document.createElement('tbody');
        table.rows.forEach((row) => {
          const tr = document.createElement('tr');
          table.columns.forEach((column, index) => {
            const cell = text('td', Array.isArray(row) ? row[index] : '');
            cell.dataset.label = column;
            tr.append(cell);
          });
          tbody.append(tr);
        });
        node.append(thead, tbody);
        wrap.append(node);
        return wrap;
      }

      function renderLinks(links) {
        const valid = (links || []).map((item) => ({ ...item, href:validLink(item.url) })).filter((item) => item.href);
        if (!valid.length) return null;
        const ul = text('ul', '', 'source-list');
        valid.forEach((item) => {
          const li = document.createElement('li');
          const anchor = text('a', item.label || item.href);
          anchor.href = item.href;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          li.append(anchor);
          ul.append(li);
        });
        return ul;
      }

      function openReader(record) {
        const recordDate = displayDateFor(record);
        if (recordDate && recordDate !== selectedDate) return;
        renderList();
        listView.hidden = false;
        list.querySelectorAll('.edition-details').forEach((node) => node.remove());
        list.querySelectorAll('.edition-card[aria-expanded="true"]').forEach((node) => node.setAttribute('aria-expanded', 'false'));
        const button = list.querySelector(`[data-record-id="${CSS.escape(record.id)}"]`);
        if (!button) return;
        button.setAttribute('aria-expanded', 'true');
        button.setAttribute('aria-label', `收合 ${displayEditionLabel(record.edition)}：${record.title}`);
        const article = text('div', '', 'article edition-details');
        article.id = `digest-panel-${record.id}`;
        article.setAttribute('aria-label', record.title);
        record.sections.forEach((data) => {
          const section = document.createElement('section');
          if (data.heading) section.append(text('h3', data.heading));
          (data.paragraphs || []).forEach((paragraph) => section.append(text('p', paragraph)));
          if (Array.isArray(data.points) && data.points.length) {
            const ul = document.createElement('ul');
            data.points.forEach((point) => ul.append(text('li', point)));
            section.append(ul);
          }
          const table = renderTable(data.table);
          if (table) section.append(table);
          const links = renderLinks(data.links);
          if (links) section.append(links);
          article.append(section);
        });
        const sources = renderLinks(record.sources);
        if (sources) {
          const section = document.createElement('section');
          section.append(text('h3', '來源'));
          section.append(sources);
          article.append(section);
        }
        const closeButton = text('button', '收合摘要', 'reader-close');
        closeButton.type = 'button';
        closeButton.addEventListener('click', () => {
          closeReader();
          button.focus({ preventScroll:true });
          button.scrollIntoView({ block:'center', behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        });
        article.append(closeButton);
        button.after(article);
        document.title = `${record.title} · E+ 市場摘要`;
      }

      function closeReader() {
        document.title = 'E+ 市場摘要';
        list.querySelectorAll('.edition-details').forEach((node) => node.remove());
        list.querySelectorAll('.edition-card[aria-expanded="true"]').forEach((node) => {
          node.setAttribute('aria-expanded', 'false');
          if (node.dataset.closedLabel) node.setAttribute('aria-label', node.dataset.closedLabel);
        });
      }
      renderList();
      restoreScroll();
    })();
  </script>
</body>
</html>
