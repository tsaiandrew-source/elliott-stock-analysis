[package]
name = "elliott-plus"
version = "0.1.1"
description = "Durable desktop shell for Elliott+ stock analysis"
authors = ["Andrew Tsai"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "elliott_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
