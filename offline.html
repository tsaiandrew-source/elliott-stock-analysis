<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ELLIOTT+">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/elliott-plus-apple-touch-icon.png">
  <title>ELLIOTT+ · Offline</title>
  <style>
    :root { color-scheme:dark; --bg:#071018; --surface:#0d1a25; --line:#203849; --text:#edf6fb; --muted:#91a8b7; --aqua:#55d9d5; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); }
    body { min-height:100vh; min-height:100dvh; margin:0; display:grid; place-items:center; padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-align:center; -webkit-text-size-adjust:100%; }
    main { width:min(420px,100%); padding:28px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
    img { width:80px; height:80px; border-radius:18px; }
    h1 { margin:18px 0 8px; color:var(--aqua); font-size:24px; }
    p { margin:0 0 20px; color:var(--muted); }
    a { display:inline-flex; min-height:44px; align-items:center; justify-content:center; padding:10px 16px; border:1px solid var(--aqua); border-radius:10px; color:var(--aqua); text-decoration:none; font-weight:800; }
  </style>
</head>
<body>
  <main>
    <img src="./assets/elliott-plus-icon-192.png" alt="">
    <h1>目前離線</h1>
    <p>已快取的分析頁面仍可從上一頁開啟；重新連線後即可取得最新資料。</p>
    <a href="./data-model/home.html">重試分析首頁</a>
  </main>
</body>
</html>
