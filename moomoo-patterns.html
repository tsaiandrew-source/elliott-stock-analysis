    const changeCellFields={pattern:[&#x27;pattern&#x27;,&#x27;target&#x27;],targetDate:[&#x27;date&#x27;],targetAmplitudePct:[&#x27;amplitude&#x27;],confidence:[&#x27;confidence&#x27;],momentum:[&#x27;momentum&#x27;],technicalAction:[&#x27;action&#x27;,&#x27;wyckoff&#x27;]};
    const changeLabels={pattern:&#x27;型態／分析&#x27;,target:&#x27;目標&#x27;,date:&#x27;推估日期&#x27;,amplitude:&#x27;推估幅度&#x27;,confidence:&#x27;信心&#x27;,momentum:&#x27;動能狀態&#x27;,action:&#x27;技術處置／期權&#x27;,wyckoff:&#x27;Wyckoff&#x27;};
    function cell(r,key,body){const changed=(summary.changedFields[r.ticker]||[]).some(f=&gt;(changeCellFields[key]||[]).includes(f))?&#x27; changed&#x27;:&#x27;&#x27;;return `&lt;td data-label=&quot;${labels[key]}&quot; class=&quot;${changed}&quot;&gt;&lt;div class=&quot;cell-value&quot;&gt;${body}&lt;/div&gt;&lt;/td&gt;`}
    function render(){let view=rows.filter(r=&gt;r.ticker.includes(state.query)&amp;&amp;(!state.actions.size||state.actions.has(r.technicalAction))&amp;&amp;(!state.momenta.size||state.momenta.has(r.momentum))).sort(cmp);document.getElementById(&#x27;visible-count&#x27;).textContent=`顯示 ${view.length}／${rows.length} 檔；所有統計以完整 All 名冊計算。`;
    document.getElementById(&#x27;rows&#x27;).innerHTML=view.map(r=&gt;{const newcomer=summary.added.includes(r.ticker);const tone=r.dailyChange&gt;0?&#x27;positive&#x27;:r.dailyChange&lt;0?&#x27;negative&#x27;:&#x27;&#x27;;const p=`&lt;strong&gt;${esc(r.pattern)}&lt;/strong&gt;&lt;span class=&quot;line tiny&quot;&gt;結構／邊界：${esc(r.boundary)}&lt;/span&gt;&lt;span class=&quot;line tiny&quot;&gt;確認：${esc(r.confirmation)}&lt;/span&gt;&lt;span class=&quot;line tiny&quot;&gt;目標：${usd(r.target)}；失效位：${esc(r.invalidation)}&lt;/span&gt;&lt;span class=&quot;line tiny&quot;&gt;${esc(r.analysis)}&lt;/span&gt;`;
    const m=`&lt;span class=&quot;status&quot;&gt;${esc(r.momentum)}&lt;/span&gt;&lt;span class=&quot;line tiny&quot;&gt;RSI(14) ${r.rsi14.toFixed(1)}；Slow Stochastic(14,3,3) ${r.slowStochasticK14_3_3.toFixed(1)}/${r.slowStochasticD14_3_3.toFixed(1)}&lt;/span&gt;&lt;span class=&quot;line tiny&quot;&gt;MACD(12,26,9) ${r.macd12_26.toFixed(2)}/${r.macdSignal9.toFixed(2)}；柱 ${r.macdHistogram.toFixed(2)}&lt;/span&gt;`;
    const a=`&lt;span class=&quot;status&quot;&gt;${esc(r.technicalAction)}&lt;/span&gt;&lt;span class=&quot;line tiny&quot;&gt;Wyckoff：${esc(r.wyckoff)}&lt;/span&gt;${r.options.map(option).join(&#x27;&#x27;)}`;
    return `&lt;tr class=&quot;${newcomer?&#x27;new&#x27;:&#x27;&#x27;}&quot; data-ticker=&quot;${r.ticker}&quot;&gt;${cell(r,&#x27;ticker&#x27;,`&lt;span class=&quot;ticker&quot;&gt;${r.ticker}&lt;/span&gt;${newcomer?&#x27;&lt;span class=&quot;new-tag&quot;&gt;新增&lt;/span&gt;&#x27;:&#x27;&#x27;}`)}${cell(r,&#x27;close&#x27;,`&lt;span class=&quot;stack&quot;&gt;&lt;strong&gt;${usd(r.close)}&lt;/strong&gt;&lt;span class=&quot;${tone}&quot;&gt;${signed(r.dailyChange)}&lt;/span&gt;&lt;span class=&quot;${tone}&quot;&gt;${signed(r.dailyChangePct,&#x27;%&#x27;)}&lt;/span&gt;&lt;/span&gt;`)}${cell(r,&#x27;pattern&#x27;,p+`&lt;span class=&quot;line tiny&quot;&gt;3 個月 ${signed(r.threeMonthPct,&#x27;%&#x27;)}；6 個月 ${signed(r.sixMonthPct,&#x27;%&#x27;)}；YTD ${signed(r.ytdPct,&#x27;%&#x27;)}&lt;/span&gt;`)}${cell(r,&#x27;targetDate&#x27;,r.targetDate?`${esc(r.targetDate)}&lt;span class=&quot;line tiny&quot;&gt;${r.confirmation.includes(&#x27;已&#x27;)?&#x27;推估&#x27;:&#x27;條件式推估&#x27;}&lt;/span&gt;`:&#x27;—&#x27;)}${cell(r,&#x27;targetAmplitudePct&#x27;,r.targetAmplitudePct==null?&#x27;—&#x27;:`${r.targetAmplitudePct&gt;0?&#x27;+&#x27;:&#x27;&#x27;}${r.targetAmplitudePct.toFixed(1)}%`)}${cell(r,&#x27;confidence&#x27;,r.confidence==null?&#x27;—&#x27;:`${r.confidence}%`)}${cell(r,&#x27;momentum&#x27;,m)}${cell(r,&#x27;technicalAction&#x27;,a)}&lt;/tr&gt;`}).join(&#x27;&#x27;)||&#x27;&lt;tr&gt;&lt;td class=&quot;empty&quot; colspan=&quot;8&quot;&gt;沒有符合條件的股票&lt;/td&gt;&lt;/tr&gt;&#x27;;
    document.querySelectorAll(&#x27;th[data-key]&#x27;).forEach(th=&gt;{const active=th.dataset.key===state.key;th.querySelector(&#x27;button&#x27;).textContent=labels[th.dataset.key]+&#x27; &#x27;+(active?(state.dir===1?&#x27;↑&#x27;:&#x27;↓&#x27;):&#x27;↕&#x27;);th.setAttribute(&#x27;aria-sort&#x27;,active?(state.dir===1?&#x27;ascending&#x27;:&#x27;descending&#x27;):&#x27;none&#x27;)});document.getElementById(&#x27;mobile-sort&#x27;).value=state.key;document.getElementById(&#x27;mobile-direction&#x27;).textContent=state.dir===1?&#x27;升冪 ↑&#x27;:&#x27;降冪 ↓&#x27;}
    function makeFilter(id,field,selected,items){const el=document.getElementById(id);for(const value of items){const b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.className=&#x27;chip&#x27;;b.dataset.value=value;b.textContent=value===&#x27;全部&#x27;?&#x27;全部&#x27;:`${value} ${rows.filter(r=&gt;r[field]===value).length}`;b.onclick=()=&gt;{if(value===&#x27;全部&#x27;)selected.clear();else if(selected.has(value))selected.delete(value);else selected.add(value);el.querySelectorAll(&#x27;button&#x27;).forEach(x=&gt;{const on=x.dataset.value===&#x27;全部&#x27;?!selected.size:selected.has(x.dataset.value);x.classList.toggle(&#x27;active&#x27;,on);x.setAttribute(&#x27;aria-pressed&#x27;,String(on))});render()};el.appendChild(b)}el.querySelector(&#x27;button&#x27;).classList.add(&#x27;active&#x27;)}
    makeFilter(&#x27;action-filter&#x27;,&#x27;technicalAction&#x27;,state.actions,[&#x27;全部&#x27;,&#x27;確認&#x27;,&#x27;觀望&#x27;,&#x27;規避&#x27;,&#x27;不宜&#x27;]);makeFilter(&#x27;momentum-filter&#x27;,&#x27;momentum&#x27;,state.momenta,[&#x27;全部&#x27;,&#x27;超買／過熱&#x27;,&#x27;偏強&#x27;,&#x27;中性&#x27;,&#x27;偏弱&#x27;,&#x27;超賣&#x27;]);
    document.getElementById(&#x27;search&#x27;).oninput=e=&gt;{state.query=e.target.value.trim().toUpperCase();render()};document.querySelectorAll(&#x27;th[data-key] button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{const k=b.parentElement.dataset.key;state.dir=state.key===k?-state.dir:1;state.key=k;render()});const sel=document.getElementById(&#x27;mobile-sort&#x27;);for(const [k,v] of Object.entries(labels)){const o=document.createElement(&#x27;option&#x27;);o.value=k;o.textContent=v;sel.appendChild(o)}sel.onchange=e=&gt;{state.key=e.target.value;state.dir=1;render()};document.getElementById(&#x27;mobile-direction&#x27;).onclick=()=&gt;{state.dir=-state.dir;render()};
    const items=[];if(summary.comparisonDate){items.push(`名冊新增：${summary.added.length?summary.added.join(&#x27;、&#x27;):&#x27;無&#x27;}；移除：${summary.removed.length?summary.removed.join(&#x27;、&#x27;):&#x27;無&#x27;}。`);for(const [ticker,fields] of Object.entries(summary.changedFields))if(fields.length)items.push(`${ticker}：${fields.map(f=&gt;changeLabels[f]||f).join(&#x27;、&#x27;)}已變更。`);if(items.length===1)items.push(&#x27;分析欄位沒有實質變更；收市價變化不標差異。&#x27;)}else{items.push(`相對 09/23 舊公開頁新增：${summary.added.length?summary.added.join(&#x27;、&#x27;):&#x27;無&#x27;}；剔除：${summary.removed.length?summary.removed.join(&#x27;、&#x27;):&#x27;無&#x27;}。`);items.push(&#x27;ONDL 已依 Andrew 指示排除於自有 All 名冊。&#x27;);items.push(&#x27;分析欄位：首次 All 基線，無可核實的前日差異；股價變化不標差異。&#x27;)}document.getElementById(&#x27;summary-items&#x27;).innerHTML=items.map(x=&gt;`&lt;li&gt;${esc(x)}&lt;/li&gt;`).join(&#x27;&#x27;);render();
    &lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></body></html>
