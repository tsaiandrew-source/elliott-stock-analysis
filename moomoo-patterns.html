:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,

  color: var(--foreground);
  background: transparent !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h2,
h3,
h4,
h5,
h6,
p {

}

}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;

  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;

  box-decoration-break: clone;

}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  margin-block: 6px;

  background: var(--border);
}

  min-width: 0;
  align-items: center;
  gap: 4px;
}

  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;

  color: var(--accent-foreground);
  background: var(--accent);

.text-small,

}

.text-muted {

}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {

  text-decoration: none;

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

.nav-justified .nav-link {

  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;/header&gt;

  &lt;section class=&quot;analysis-group&quot; data-scope=&quot;全部清單&quot;&gt;

      &lt;span&gt;&lt;strong class=&quot;overview-avoid&quot;&gt;1&lt;/strong&gt; 規避&lt;/span&gt;
      &lt;span&gt;&lt;strong class=&quot;overview-unsuitable&quot;&gt;2&lt;/strong&gt; 不宜&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;control-panel&quot; aria-label=&quot;搜尋、檢視與篩選&quot;&gt;
    &lt;div class=&quot;dashboard-toolbar&quot;&gt;
      &lt;label class=&quot;form-label search-label&quot;&gt;搜尋股票
        &lt;input class=&quot;form-control ticker-search&quot; type=&quot;search&quot; inputmode=&quot;search&quot; autocomplete=&quot;off&quot; placeholder=&quot;例如 NBIS&quot; aria-describedby=&quot;search-help&quot;&gt;
      &lt;/label&gt;
      &lt;span id=&quot;search-help&quot; class=&quot;sr-only&quot;&gt;輸入完整或部分股票代號&lt;/span&gt;
      &lt;div class=&quot;view-mode&quot; role=&quot;group&quot; aria-labelledby=&quot;view-mode-label&quot;&gt;
        &lt;span class=&quot;group-label&quot; id=&quot;view-mode-label&quot;&gt;檢視&lt;/span&gt;
        &lt;div class=&quot;view-options&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn view-button active&quot; data-view=&quot;decision&quot; aria-pressed=&quot;true&quot;&gt;決策檢視&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost view-button&quot; data-view=&quot;full&quot; aria-pressed=&quot;false&quot;&gt;完整分析&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;decision-filters&quot; aria-label=&quot;決策篩選&quot;&gt;
      &lt;div class=&quot;filter-group&quot; data-filter=&quot;action&quot; role=&quot;group&quot; aria-labelledby=&quot;action-filter-label&quot;&gt;
        &lt;span class=&quot;group-label&quot; id=&quot;action-filter-label&quot;&gt;技術處置&lt;/span&gt;
        &lt;div class=&quot;filter-options&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip active&quot; data-value=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;全部&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip action-confirm&quot; data-value=&quot;確認&quot; aria-pressed=&quot;false&quot;&gt;確認 &lt;span class=&quot;filter-count&quot;&gt;1&lt;/span&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip action-watch&quot; data-value=&quot;觀望&quot; aria-pressed=&quot;false&quot;&gt;觀望 &lt;span class=&quot;filter-count&quot;&gt;19&lt;/span&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip action-avoid&quot; data-value=&quot;規避&quot; aria-pressed=&quot;false&quot;&gt;規避 &lt;span class=&quot;filter-count&quot;&gt;1&lt;/span&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip action-unsuitable&quot; data-value=&quot;不宜&quot; aria-pressed=&quot;false&quot;&gt;不宜 &lt;span class=&quot;filter-count&quot;&gt;2&lt;/span&gt;&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;filter-group&quot; data-filter=&quot;momentum&quot; role=&quot;group&quot; aria-labelledby=&quot;momentum-filter-label&quot;&gt;

        &lt;div class=&quot;filter-options&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip active&quot; data-value=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;全部&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip momentum-hot&quot; data-value=&quot;超買／過熱&quot; aria-pressed=&quot;false&quot;&gt;過熱&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip momentum-strong&quot; data-value=&quot;偏強&quot; aria-pressed=&quot;false&quot;&gt;偏強&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip momentum-neutral&quot; data-value=&quot;中性&quot; aria-pressed=&quot;false&quot;&gt;中性&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip momentum-weak&quot; data-value=&quot;偏弱&quot; aria-pressed=&quot;false&quot;&gt;偏弱&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip momentum-oversold&quot; data-value=&quot;超賣&quot; aria-pressed=&quot;false&quot;&gt;超賣&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;filter-group&quot; data-filter=&quot;scope&quot; role=&quot;group&quot; aria-labelledby=&quot;scope-filter-label&quot;&gt;
        &lt;span class=&quot;group-label&quot; id=&quot;scope-filter-label&quot;&gt;清單&lt;/span&gt;
        &lt;div class=&quot;filter-options&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip active&quot; data-value=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;全部&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip&quot; data-value=&quot;List 1&quot; aria-pressed=&quot;false&quot;&gt;List 1&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;filter-chip&quot; data-value=&quot;Candidate&quot; aria-pressed=&quot;false&quot;&gt;Candidate&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;filter-summary&quot;&gt;
        &lt;span class=&quot;filter-status&quot; aria-live=&quot;polite&quot;&gt;顯示 23／23 檔&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost reset-filters&quot; disabled&gt;清除篩選&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;/div&gt;
    &lt;details class=&quot;logic-note text-small&quot;&gt;
      &lt;summary&gt;欄位說明與判定規則&lt;/summary&gt;
      &lt;p&gt;&lt;strong&gt;動能：&lt;/strong&gt;採日線 RSI(14)、Stochastic(14,3) 與 MACD(12,26,9)。RSI ≥ 70，或 %K ≥ 80 且 RSI ≥ 60，列「超買／過熱」；RSI ≤ 30，或 %K ≤ 20 且 RSI ≤ 40，列「超賣」；RSI ≥ 55、%K ≥ %D、MACD 線 ≥ 訊號線，列「偏強」；RSI &amp;lt; 45 且 MACD 線 &amp;lt; 訊號線，列「偏弱」；其餘列「中性」。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Wyckoff：&lt;/strong&gt;累積／再累積 Phase D–E、SOS、LPS 或 Markup 視為結構支持；Phase B、待判定或未定向視為中性；已確認的派發／再派發 Phase D–E、SOW、LPSY 或 Mark-down 視為結構風險。古典型態與 Wyckoff 結構衝突時降為「觀望」。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;期權定位：&lt;/strong&gt;每日對所有股票嘗試核對 GEX、履約價 OI 與 IV／EM，分別建立本週及下週價格窗口，並辨識 Put Wall、Gamma Flip、Call Wall 與 Gamma 遷移。至少兩項期權證據互相支持才形成定位結論；OI 是存量、IV／EM 只表示市場定價幅度，兩者都不單獨代表方向。期權資料可以把「確認」降為「觀望」，不可單獨把「觀望」升為「確認」；不可用或過期時標示原因，不以舊值或推測補齊。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;技術處置：&lt;/strong&gt;「確認」須型態已確認、信心 ≥ 75%、剩餘上行幅度 &amp;gt; 5%，Wyckoff 結構支持，且非過熱／偏弱／超賣，同時 %K ≥ %D、MACD 線 ≥ 訊號線、柱狀圖 ≥ 0，並且同日已核對的期權定位沒有衝突；下行目標或已確認的 Wyckoff 派發風險列「規避」；無新前瞻型態、RSI &amp;lt; 50、MACD 線低於零軸且柱狀圖 &amp;lt; 0，且 Wyckoff 未提供正面支持時列「不宜」；其餘列「觀望」。這是技術篩選狀態，不是交易指令。&lt;/p&gt;
    &lt;/details&gt;
    &lt;p class=&quot;sort-status text-small&quot; aria-live=&quot;polite&quot;&gt;目前排序：技術處置（優先順序）&lt;/p&gt;
    &lt;div class=&quot;viz-controls mobile-sort-controls&quot; aria-label=&quot;全部清單排序控制&quot;&gt;
      &lt;label class=&quot;form-label&quot;&gt;排序欄位
        &lt;select class=&quot;form-select mobile-sort-key&quot;&gt;

          &lt;option value=&quot;close&quot;&gt;收市價&lt;/option&gt;
          &lt;option value=&quot;pattern&quot;&gt;型態／確認&lt;/option&gt;
          &lt;option value=&quot;target&quot;&gt;推估價格&lt;/option&gt;
          &lt;option value=&quot;date&quot;&gt;推估日期&lt;/option&gt;
          &lt;option value=&quot;upside&quot;&gt;推估幅度&lt;/option&gt;
          &lt;option value=&quot;confidence&quot;&gt;信心&lt;/option&gt;
          &lt;option value=&quot;momentum&quot;&gt;動能狀態&lt;/option&gt;
          &lt;option value=&quot;action&quot;&gt;技術處置&lt;/option&gt;
          &lt;option value=&quot;wyckoff&quot;&gt;Wyckoff 階段／預期行為&lt;/option&gt;
          &lt;option value=&quot;analysis&quot;&gt;技術分析摘要&lt;/option&gt;
        &lt;/select&gt;
      &lt;/label&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn mobile-sort-direction&quot; aria-label=&quot;全部清單排序方向：升冪&quot;&gt;升冪 ↑&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;

    return row.k &gt;= row.d ? &#x27;向上&#x27; : &#x27;向下&#x27;;
  }

  function macdLabel(row) {
    if (row.hist &gt;= 0) return row.hist &gt; row.histPrev ? &#x27;多方擴張&#x27; : &#x27;多方收斂&#x27;;
    return row.hist &lt; row.histPrev ? &#x27;空方擴張&#x27; : &#x27;空方收斂&#x27;;
  }

  function momentumEvidence(row) {
    return `RSI ${row.rsi.toFixed(1)} · Stoch ${row.k.toFixed(1)}/${row.d.toFixed(1)} ${stochasticLabel(row)} · MACD ${macdLabel(row)}`;
  }

  function analysisHtml(row) {
    const items = row.analysis.slice();
    items[3] = `RSI(14) ${row.rsi.toFixed(1)}；Stochastic(14,3) %K ${row.k.toFixed(1)}／%D ${row.d.toFixed(1)}（${stochasticLabel(row)}）；MACD(12,26,9) ${macdLabel(row)}`;
    return `&lt;ul class=&quot;analysis-list&quot;&gt;${items.map(item =&gt; `&lt;li&gt;${item}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;`;
  }

  function confirmationHtml(row) {
    if (!row.condition.startsWith(&#x27;已確認&#x27;)) return `&lt;strong&gt;${row.condition}&lt;/strong&gt;`;
    const direction = row.upside != null &amp;&amp; row.upside &lt; 0 ? &#x27;down&#x27; : &#x27;up&#x27;;
    return `&lt;strong class=&quot;confirmation-confirmed-${direction}&quot;&gt;已確認&lt;/strong&gt;${row.condition.slice(3)}`;
  }

  function setupGroup(group) {
    const scope = &#x27;全部清單&#x27;;
    const body = group.querySelector(&#x27;tbody&#x27;);
    const status = group.querySelector(&#x27;.sort-status&#x27;);
    const mobileKey = group.querySelector(&#x27;.mobile-sort-key&#x27;);
    const mobileDirection = group.querySelector(&#x27;.mobile-sort-direction&#x27;);
    const filterStatus = group.querySelector(&#x27;.filter-status&#x27;);
    const resetFilters = group.querySelector(&#x27;.reset-filters&#x27;);
    const searchInput = group.querySelector(&#x27;.ticker-search&#x27;);
    const viewButtons = group.querySelectorAll(&#x27;.view-button&#x27;);
    const filters = {
      scope: new Set(),
      action: new Set(),
      momentum: new Set(),
      query: &#x27;&#x27;
    };
    let sortKey = &#x27;action&#x27;;
    let direction = 1;

    const actionTotals = mergedRows.reduce((totals, row) =&gt; {
      totals[row.action] = (totals[row.action] || 0) + 1;
      return totals;
    }, {});
    root.querySelector(&#x27;.overview-confirm&#x27;).textContent = actionTotals[&#x27;確認&#x27;] || 0;
    root.querySelector(&#x27;.overview-watch&#x27;).textContent = actionTotals[&#x27;觀望&#x27;] || 0;
    root.querySelector(&#x27;.overview-avoid&#x27;).textContent = actionTotals[&#x27;規避&#x27;] || 0;
    root.querySelector(&#x27;.overview-unsuitable&#x27;).textContent = actionTotals[&#x27;不宜&#x27;] || 0;
    group.querySelectorAll(&#x27;[data-filter=&quot;action&quot;] .filter-chip[data-value]&#x27;).forEach(button =&gt; {
      const count = button.querySelector(&#x27;.filter-count&#x27;);
      if (count) count.textContent = actionTotals[button.dataset.value] || 0;
    });

    function render() {
      const visibleRows = mergedRows.filter(row =&gt;
        (!filters.scope.size || [...filters.scope].some(value =&gt; row.lists.includes(value))) &amp;&amp;
        (!filters.action.size || filters.action.has(row.action)) &amp;&amp;
        (!filters.momentum.size || filters.momentum.has(row.momentum)) &amp;&amp;
        (!filters.query || row.ticker.includes(filters.query))
      );
      body.innerHTML = visibleRows.length ? visibleRows.slice().sort((a, b) =&gt; compare(a, b, sortKey, direction)).map(row =&gt; `
      &lt;tr data-ticker=&quot;${row.ticker}&quot;&gt;
        &lt;td data-field=&quot;ticker&quot; data-label=&quot;股票代號&quot; class=&quot;${changedClass(row,&#x27;ticker&#x27;)}&quot;&gt;&lt;span class=&quot;ticker-main&quot;&gt;${row.ticker}&lt;/span&gt;&lt;/td&gt;
        &lt;td data-field=&quot;close&quot; data-label=&quot;收市價&quot; class=&quot;numeric&quot;&gt;${money(row.close)}&lt;/td&gt;
        &lt;td data-field=&quot;pattern&quot; data-label=&quot;型態／確認&quot; class=&quot;${changedClass(row,&#x27;pattern&#x27;)}&quot;&gt;&lt;span class=&quot;ticker-main&quot;&gt;${row.pattern}&lt;/span&gt;&lt;span class=&quot;cell-note text-small&quot;&gt;${row.analysis[0]}&lt;/span&gt;&lt;span class=&quot;cell-note text-small&quot;&gt;${confirmationHtml(row)}&lt;br&gt;${row.analysis[1]}&lt;br&gt;${row.analysis[row.analysis.length - 1]}&lt;/span&gt;&lt;/td&gt;
        &lt;td data-field=&quot;target&quot; data-label=&quot;推估價格&quot; class=&quot;numeric ${changedClass(row,&#x27;target&#x27;)}&quot;&gt;${row.target == null ? &#x27;—&#x27; : money(row.target) + (row.targetConditional ? &#x27;（條件式）&#x27; : &#x27;&#x27;)}&lt;/td&gt;
        &lt;td data-field=&quot;date&quot; data-label=&quot;推估日期&quot; class=&quot;text-nowrap ${changedClass(row,&#x27;date&#x27;)}&quot;&gt;${row.dateLabel == null ? &#x27;—&#x27; : row.dateLabel + (row.targetConditional ? &#x27;（條件式）&#x27; : &#x27;&#x27;)}&lt;/td&gt;
        &lt;td data-field=&quot;upside&quot; data-label=&quot;推估幅度&quot; class=&quot;numeric ${changedClass(row,&#x27;upside&#x27;)}&quot;&gt;${row.upside == null ? &#x27;—&lt;span class=&quot;cell-note text-small&quot;&gt;無有效前瞻目標&lt;/span&gt;&#x27; : `${row.upside &gt; 0 ? &#x27;+&#x27; : &#x27;&#x27;}${row.upside.toFixed(1)}%&lt;span class=&quot;cell-note text-small&quot;&gt;${row.upside &lt; 0 ? `下行目標約 ${money(row.target)}，相對幅度 ${row.upside.toFixed(1)}%` : `量度目標約 ${money(row.target)}，尚餘 ${row.upside.toFixed(1)}%`}&lt;/span&gt;`}&lt;/td&gt;
        &lt;td data-field=&quot;confidence&quot; data-label=&quot;信心&quot; class=&quot;numeric ${changedClass(row,&#x27;confidence&#x27;)}&quot;&gt;${row.confidence}%&lt;/td&gt;
        &lt;td data-field=&quot;momentum&quot; data-label=&quot;動能狀態&quot; class=&quot;${changedClass(row,&#x27;momentum&#x27;)}&quot;&gt;&lt;span class=&quot;status-badge momentum-${row.momentumKey}&quot;&gt;${row.momentum}&lt;/span&gt;&lt;span class=&quot;momentum-evidence text-small&quot;&gt;${momentumEvidence(row)}&lt;/span&gt;&lt;/td&gt;
        &lt;td data-field=&quot;action&quot; data-label=&quot;技術處置&quot; class=&quot;${changedClass(row,&#x27;action&#x27;)}&quot;&gt;&lt;span class=&quot;status-badge action-${row.actionKey}&quot;&gt;${row.action}&lt;/span&gt;&lt;span class=&quot;cell-note text-small wyckoff-${row.wyckoffKey}&quot;&gt;Wyckoff ${row.wyckoffLabel}：${row.wyckoffStage}&lt;/span&gt;${optionsEvidence(row)}&lt;/td&gt;
        &lt;td data-field=&quot;wyckoff&quot; data-label=&quot;Wyckoff 階段／預期行為&quot; class=&quot;${changedClass(row,&#x27;wyckoff&#x27;)}&quot;&gt;${row.wyckoff}&lt;/td&gt;
        &lt;td data-field=&quot;analysis&quot; data-label=&quot;技術分析摘要&quot; class=&quot;${changedClass(row,&#x27;analysis&#x27;)}&quot;&gt;${analysisHtml(row)}&lt;/td&gt;
      &lt;/tr&gt;`).join(&#x27;&#x27;) : &#x27;&lt;tr&gt;&lt;td colspan=&quot;11&quot; class=&quot;empty-row&quot;&gt;沒有符合目前組合的股票。&lt;/td&gt;&lt;/tr&gt;&#x27;;

      group.querySelectorAll(&#x27;th[data-key]&#x27;).forEach(th =&gt; {
      const active = th.dataset.key === sortKey;
      th.setAttribute(&#x27;aria-sort&#x27;, active ? (direction === 1 ? &#x27;ascending&#x27; : &#x27;descending&#x27;) : &#x27;none&#x27;);
      const button = th.querySelector(&#x27;button&#x27;);
      button.textContent = `${labels[th.dataset.key]} ${active ? (direction === 1 ? &#x27;↑&#x27; : &#x27;↓&#x27;) : &#x27;↕&#x27;}`;
      });
      mobileKey.value = sortKey;
      mobileDirection.textContent = direction === 1 ? &#x27;升冪 ↑&#x27; : &#x27;降冪 ↓&#x27;;
      mobileDirection.setAttribute(&#x27;aria-label&#x27;, `${scope} 排序方向：${direction === 1 ? &#x27;升冪&#x27; : &#x27;降冪&#x27;}`);
      status.textContent = `${scope} 目前排序：${labels[sortKey]}（${sortKey === &#x27;action&#x27; &amp;&amp; direction === 1 ? &#x27;決策優先&#x27; : direction === 1 ? &#x27;升冪&#x27; : &#x27;降冪&#x27;}）`;
      filterStatus.textContent = `顯示 ${visibleRows.length}／${mergedRows.length} 檔${filters.query ? `，搜尋「${filters.query}」` : &#x27;&#x27;}`;
      resetFilters.disabled = !filters.scope.size &amp;&amp; !filters.action.size &amp;&amp; !filters.momentum.size &amp;&amp; !filters.query;
    }

    group.querySelectorAll(&#x27;.filter-group&#x27;).forEach(filterGroup =&gt; {
      const key = filterGroup.dataset.filter;
      filterGroup.querySelectorAll(&#x27;.filter-chip&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const value = button.dataset.value;
          if (value === &#x27;all&#x27;) {
            filters[key].clear();
          } else if (filters[key].has(value)) {
            filters[key].delete(value);
          } else {
            filters[key].add(value);
          }
          filterGroup.querySelectorAll(&#x27;.filter-chip&#x27;).forEach(option =&gt; {
            const optionValue = option.dataset.value;
            const active = optionValue === &#x27;all&#x27; ? filters[key].size === 0 : filters[key].has(optionValue);
            option.classList.toggle(&#x27;active&#x27;, active);
            option.setAttribute(&#x27;aria-pressed&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
          });
          render();
        });
      });
    });

    resetFilters.addEventListener(&#x27;click&#x27;, () =&gt; {
      filters.scope.clear();
      filters.action.clear();
      filters.momentum.clear();
      filters.query = &#x27;&#x27;;
      searchInput.value = &#x27;&#x27;;
      group.querySelectorAll(&#x27;.filter-group&#x27;).forEach(filterGroup =&gt; {
        filterGroup.querySelectorAll(&#x27;.filter-chip&#x27;).forEach(button =&gt; {
          const active = button.dataset.value === &#x27;all&#x27;;
          button.classList.toggle(&#x27;active&#x27;, active);
          button.setAttribute(&#x27;aria-pressed&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
      });
      render();
    });

    searchInput.addEventListener(&#x27;input&#x27;, () =&gt; {
      filters.query = searchInput.value.trim().toUpperCase();
      render();
    });

    viewButtons.forEach(button =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const view = button.dataset.view;
        root.classList.toggle(&#x27;view-decision&#x27;, view === &#x27;decision&#x27;);
        root.classList.toggle(&#x27;view-full&#x27;, view === &#x27;full&#x27;);
        viewButtons.forEach(option =&gt; {
          const active = option === button;
          option.classList.toggle(&#x27;active&#x27;, active);
          option.classList.toggle(&#x27;btn-ghost&#x27;, !active);
          option.setAttribute(&#x27;aria-pressed&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        if (view === &#x27;decision&#x27; &amp;&amp; [&#x27;target&#x27;,&#x27;wyckoff&#x27;,&#x27;analysis&#x27;].includes(sortKey)) {
          sortKey = &#x27;action&#x27;;
          direction = 1;
        }
        render();
      });
    });

    group.querySelectorAll(&#x27;th[data-key] button&#x27;).forEach(button =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const key = button.closest(&#x27;th&#x27;).dataset.key;
        if (sortKey === key) direction *= -1;
        else { sortKey = key; direction = 1; }
        render();
      });
    });

    mobileKey.addEventListener(&#x27;change&#x27;, () =&gt; {
      sortKey = mobileKey.value;
      direction = 1;
      render();
    });

    mobileDirection.addEventListener(&#x27;click&#x27;, () =&gt; {
      direction *= -1;
      render();
    });

    render();
  }

  root.querySelectorAll(&#x27;.analysis-group&#x27;).forEach(setupGroup);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
