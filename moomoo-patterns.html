    document.querySelectorAll(&#x27;th[data-key]&#x27;).forEach(th=&gt;{const active=th.dataset.key===state.key;th.querySelector(&#x27;button&#x27;).textContent=labels[th.dataset.key]+&#x27; &#x27;+(active?(state.dir===1?&#x27;↑&#x27;:&#x27;↓&#x27;):&#x27;↕&#x27;);th.setAttribute(&#x27;aria-sort&#x27;,active?(state.dir===1?&#x27;ascending&#x27;:&#x27;descending&#x27;):&#x27;none&#x27;)});document.getElementById(&#x27;mobile-sort&#x27;).value=state.key;document.getElementById(&#x27;mobile-direction&#x27;).textContent=state.dir===1?&#x27;升冪 ↑&#x27;:&#x27;降冪 ↓&#x27;}
    function makeFilter(id,field,selected,items){const el=document.getElementById(id);for(const value of items){const b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.className=&#x27;chip&#x27;;b.dataset.value=value;b.textContent=value===&#x27;全部&#x27;?&#x27;全部&#x27;:`${value} ${rows.filter(r=&gt;r[field]===value).length}`;b.onclick=()=&gt;{if(value===&#x27;全部&#x27;)selected.clear();else if(selected.has(value))selected.delete(value);else selected.add(value);el.querySelectorAll(&#x27;button&#x27;).forEach(x=&gt;{const on=x.dataset.value===&#x27;全部&#x27;?!selected.size:selected.has(x.dataset.value);x.classList.toggle(&#x27;active&#x27;,on);x.setAttribute(&#x27;aria-pressed&#x27;,String(on))});render()};el.appendChild(b)}el.querySelector(&#x27;button&#x27;).classList.add(&#x27;active&#x27;)}

    const items=[];if(summary.comparisonDate){items.push(`名冊新增：${summary.added.length?summary.added.join(&#x27;、&#x27;):&#x27;無&#x27;}；移除：${summary.removed.length?summary.removed.join(&#x27;、&#x27;):&#x27;無&#x27;}。`);for(const [ticker,fields] of Object.entries(summary.changedFields))if(fields.length)items.push(`${ticker}：${fields.map(f=&gt;changeLabels[f]||f).join(&#x27;、&#x27;)}已變更。`);if(items.length===1)items.push(&#x27;分析欄位沒有實質變更；收市價變化不標差異。&#x27;)}else{items.push(`相對 09/23 舊公開頁新增：${summary.added.length?summary.added.join(&#x27;、&#x27;):&#x27;無&#x27;}；剔除：${summary.removed.length?summary.removed.join(&#x27;、&#x27;):&#x27;無&#x27;}。`);items.push(&#x27;ONDL 已依 Andrew 指示排除於自有 All 名冊。&#x27;);items.push(&#x27;分析欄位：首次 All 基線，無可核實的前日差異；股價變化不標差異。&#x27;)}document.getElementById(&#x27;summary-items&#x27;).innerHTML=items.map(x=&gt;`&lt;li&gt;${esc(x)}&lt;/li&gt;`).join(&#x27;&#x27;);render();
