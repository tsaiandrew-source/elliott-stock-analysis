name: Static prototype QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static QA
        run: node scripts/static-qa.mjs
      - name: Run PWA QA
        run: node scripts/pwa-qa.mjs
      - name: Run digest automation QA
        run: |
          node scripts/ingest-private-analysis-qa.mjs
          node scripts/sync-market-data-qa.mjs
          node scripts/close-digest-consumer-qa.mjs
          node scripts/close-digest-cycle-qa.mjs
          node scripts/close-digest-release-qa.mjs
          node scripts/daily-digest-autoinject-qa.mjs
          node scripts/weekly-digest-autoinject-qa.mjs
